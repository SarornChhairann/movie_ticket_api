# =============================================================================
# Production stack.  Run it with its own env file (never the dev .env):
#
#   cp .env.prod.example .env.prod && chmod 600 .env.prod   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Shape:
#   internet ──80──▶ caddy ──edge──▶ app
#            └─8080─▶ caddy ──edge──▶ keycloak
#                                 └──backend (internal, no internet)──▶ db, redis, rabbitmq
#
# - No DNS name. PUBLIC_IP is the server's public address. Caddy serves plain HTTP:
#   the API on port 80, Keycloak on port 8080. Let's Encrypt is not used.
# - Only Caddy publishes ports (80 and 8080). The API, Keycloak,
#   Postgres, Redis and RabbitMQ are reachable only inside the compose networks.
# - "backend" is internal: the data stores cannot reach the internet at all. The app
#   and Keycloak also sit on "edge", which is how the app reaches SMTP and PayWay.
# - Every service has a health check, a restart policy, memory/CPU limits, rotated
#   logs, and no-new-privileges; the app also runs read-only with all caps dropped.
# - Data lives in named volumes with fixed names, so renaming the project or a
#   stray `docker compose down` never orphans them (`down -v` still deletes them).
# =============================================================================

name: ticket-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *logging

services:
  # --------------------------------------------------------------------------- edge
  caddy:
    <<: *hardening
    image: caddy:2.10-alpine
    container_name: ticket-prod-caddy
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "80:80"
      - "8080:8080"
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?set PUBLIC_IP in .env.prod}
      # Who may open the Keycloak admin console (space-separated CIDRs).
      KEYCLOAK_ADMIN_ALLOW: ${KEYCLOAK_ADMIN_ALLOW:-127.0.0.1/32}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks:
      - edge
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  # --------------------------------------------------------------------------- app
  app:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_TAG:-latest}
    # Build here, or push from CI and set APP_IMAGE/APP_TAG to pull a fixed version.
    image: ${APP_IMAGE:-ticket-management-system}:${APP_TAG:-latest}
    container_name: ticket-prod-app
    init: true                  # tini as PID 1: forwards SIGTERM, reaps zombies
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /tmp/app:size=256m,mode=1777   # java.io.tmpdir (Tomcat work dir, multipart)
    cap_drop: [ALL]
    environment:
      SERVER_PORT: 8010
      SERVER_FORWARD_HEADERS_STRATEGY: native
      JAVA_OPTS: ${JAVA_OPTS:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ticket}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ticket}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: "false"
      SERVER_ERROR_INCLUDE_STACKTRACE: never
      SERVER_ERROR_INCLUDE_EXCEPTION: "false"
      SERVER_ERROR_INCLUDE_MESSAGE: never
      APP_UPLOADS_MOVIES_DIR: /app/uploads/movies
      APP_UPLOADS_FOOD_ITEMS_DIR: /app/uploads/food-items
      APP_UPLOADS_FOOD_ITEMS_MAX_BYTES: ${APP_UPLOADS_FOOD_ITEMS_MAX_BYTES:-5242880}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-5MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-5MB}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?set APP_CORS_ALLOWED_ORIGINS}
      # --- Keycloak: tokens carry the public issuer; the app calls Keycloak inside the network.
      KEYCLOAK_ISSUER_URI: http://${PUBLIC_IP}:8080/realms/${KEYCLOAK_REALM:-ticket-realm}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ticket-realm}/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ticket-realm}
      KEYCLOAK_LOGIN_CLIENT_ID: ${KEYCLOAK_LOGIN_CLIENT_ID:-ticket-app}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-ticket-backend}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_BOOTSTRAP_ADMIN: ${KEYCLOAK_BOOTSTRAP_ADMIN:-true}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-System Admin}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:?set APP_ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?set APP_ADMIN_PASSWORD}
      # No demo data in production.
      APP_SEED_ENABLED: "false"
      APP_SEED_FORCE: "false"
      # --- Mail (through the queue below)
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_MAIL_QUEUE_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-ticket}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_MAIL_MAX_ATTEMPTS: ${RABBITMQ_MAIL_MAX_ATTEMPTS:-4}
      # --- Redis
      APP_REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      # --- PayWay
      PAYWAY_BASE_URL: ${PAYWAY_BASE_URL:-https://checkout.payway.com.kh}
      PAYWAY_MERCHANT_ID: ${PAYWAY_MERCHANT_ID:-}
      PAYWAY_API_KEY: ${PAYWAY_API_KEY:-}
      PAYWAY_RETURN_URL: ${PAYWAY_RETURN_URL:-}
    volumes:
      - app_uploads:/app/uploads
    networks:
      - edge
      - backend
    stop_grace_period: 30s      # > spring.lifecycle.timeout-per-shutdown-phase (20s)
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }    # heap = 75% of this (MaxRAMPercentage)

  # --------------------------------------------------------------------------- auth
  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.7
    container_name: ticket-prod-keycloak
    # Production mode on Postgres (never dev-file/H2). --import-realm only creates the
    # realm when it does not exist yet; later edits made in the console are kept.
    command: start --import-realm
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      # Caddy terminates nothing: the public URL is plain HTTP on the IP.
      # Strict hostname keeps "iss" on PUBLIC_IP even when a probe uses 127.0.0.1.
      KC_HOSTNAME: http://${PUBLIC_IP}:8080
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    volumes:
      # Production realm: no demo users, HTTPS required, random client secret (see make-prod-realm.py).
      - ./deploy/keycloak/realm-prod.json:/opt/keycloak/data/import/realm-prod.json:ro
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep 'UP' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # --------------------------------------------------------------------------- data
  db:
    <<: *hardening
    image: postgres:16-alpine
    container_name: ticket-prod-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket}
      POSTGRES_USER: ${POSTGRES_USER:-ticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Read by deploy/postgres/init on the first start (empty volume) only.
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB", "-c", "log_min_duration_statement=1000"]
    shm_size: 256m
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    container_name: ticket-prod-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    # Password from the environment, not the command line (keeps it out of `ps`).
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  rabbitmq:
    <<: *hardening
    image: rabbitmq:4.1-management-alpine
    container_name: ticket-prod-rabbitmq
    hostname: rabbitmq          # the node name, and so its data dir, must stay fixed
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ticket}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      # Keep the broker under its container limit instead of being OOM-killed.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark {absolute,\"400MiB\"}"
    # No published ports: Docker cannot publish from an internal-only network. For the
    # management UI, tunnel to the container's address (see README-Docker.md), or use
    # `docker compose exec rabbitmq rabbitmqctl ...`.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

networks:
  edge:
    name: ticket-prod-edge
    driver: bridge
  backend:
    name: ticket-prod-backend
    driver: bridge
    internal: true              # no route to the internet

volumes:
  postgres_data:
    name: ticket-prod-postgres
  redis_data:
    name: ticket-prod-redis
  rabbitmq_data:
    name: ticket-prod-rabbitmq
  app_uploads:
    name: ticket-prod-uploads
  caddy_data:
    name: ticket-prod-caddy-data
  caddy_config:
    name: ticket-prod-caddy-config
