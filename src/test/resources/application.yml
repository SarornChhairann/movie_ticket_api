spring:
  datasource:
    url: "jdbc:h2:mem:mtms_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

# No broker and no Redis in tests: mail is sent in-process, caches stay in memory.
app:
  auth:
    jwt-secret: test-only-jwt-secret-0123456789abcdef0123456789
    issuer: ticket-management-system
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    password-reset-ttl: 15m
  mail:
    queue:
      enabled: false
  redis:
    enabled: false

# Same probe wiring as src/main/resources/application.yml (this file replaces it in tests).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false
