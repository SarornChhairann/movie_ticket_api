<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — MTMS'">MTMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --mtms-dark: #05060a;
            --mtms-surface: #071428;
            --mtms-card: #0b1f3a;
            --mtms-accent: #d6b25e;
            --mtms-blue: #2aa7ff;
            --mtms-text: #eaf1ff;
            --mtms-muted: rgba(234,241,255,.68);
            --mtms-border: rgba(255,255,255,.10);
            --mtms-amber: #f5a623;
        }

        /* ─── Base ─── */
        body {
            background-color: var(--mtms-dark);
            color: var(--mtms-text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Navbar ── */
        .mtms-nav {
            background: rgba(5,6,10,.88);
            backdrop-filter: saturate(160%) blur(12px);
            border-bottom: 1px solid rgba(214,178,94,.14);
            box-shadow: none;
            padding: .75rem 0;
            transition: background .3s;
        }
        .mtms-nav .navbar-brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: .5px;
            color: var(--mtms-accent) !important;
            transition: opacity .2s;
        }
        .mtms-nav .navbar-brand:hover { opacity: .85; }
        .mtms-nav .nav-link {
            color: rgba(234,241,255,.80) !important;
            font-weight: 500;
            border-radius: 8px;
            padding: .35rem .7rem !important;
            transition: color .2s, transform .15s;
        }
        .mtms-nav .nav-link:hover { color: #fff !important; transform: translateY(-1px); }
        .mtms-nav .nav-link:active { transform: translateY(0); }
        .navbar-toggler { border-color: rgba(255,255,255,.22) !important; }
        .navbar-toggler-icon { filter: invert(1); }

        /* ── Main ── */
        main.mtms-main { flex: 1; padding: 2.5rem 0; }

        /* ── Bootstrap dark overrides: Cards ── */
        .card {
            background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
            border: 1px solid var(--mtms-border);
            color: var(--mtms-text);
            transition: border-color .22s ease, box-shadow .22s ease;
        }
        .card-body { color: var(--mtms-text); }

        /* ── Tables ── */
        .table {
            color: var(--mtms-text);
            --bs-table-bg: transparent;
            --bs-table-hover-bg: rgba(255,255,255,.04);
            --bs-table-border-color: rgba(255,255,255,.08);
            --bs-table-striped-bg: rgba(255,255,255,.03);
        }
        .table thead th, .table > thead {
            background: rgba(255,255,255,.07) !important;
            color: var(--mtms-muted) !important;
            border-bottom: 1px solid rgba(255,255,255,.10) !important;
        }
        .table td, .table th { border-color: rgba(255,255,255,.07) !important; }
        .table-hover tbody tr:hover td { background: rgba(255,255,255,.04) !important; }

        /* ── Forms ── */
        .form-control, .form-select {
            background: rgba(255,255,255,.07) !important;
            border-color: rgba(255,255,255,.14) !important;
            color: var(--mtms-text) !important;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }
        .form-control::placeholder { color: var(--mtms-muted); }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,.10) !important;
            border-color: rgba(214,178,94,.42) !important;
            box-shadow: 0 0 0 .2rem rgba(214,178,94,.18) !important;
            color: var(--mtms-text) !important;
        }
        .form-control:disabled, .form-control[readonly] {
            background: rgba(255,255,255,.04) !important;
            color: rgba(234,241,255,.45) !important;
            border-color: rgba(255,255,255,.08) !important;
        }
        .form-label { color: var(--mtms-text); }
        .input-group-text {
            background: rgba(255,255,255,.07) !important;
            border-color: rgba(255,255,255,.14) !important;
            color: var(--mtms-muted) !important;
        }

        /* ── Buttons ── */
        .btn { transition: transform .15s ease, box-shadow .18s ease, filter .18s ease, background .18s ease, border-color .18s ease, color .18s ease; }
        .btn:active { transform: translateY(0) !important; }

        .btn-primary {
            background: linear-gradient(135deg, #d6b25e, #f0d080);
            border: none;
            color: #1b1408;
            font-weight: 700;
        }
        .btn-primary:hover, .btn-primary:focus { filter: brightness(1.06); color: #1b1408; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(214,178,94,.28); }
        .btn-primary:focus-visible { box-shadow: 0 0 0 .25rem rgba(214,178,94,.35) !important; }

        .btn-outline-primary {
            border-color: rgba(214,178,94,.45);
            color: var(--mtms-accent);
        }
        .btn-outline-primary:hover, .btn-outline-primary:focus { background: rgba(214,178,94,.14); border-color: rgba(214,178,94,.65); color: var(--mtms-accent); transform: translateY(-1px); }

        .btn-outline-secondary {
            border-color: rgba(255,255,255,.22);
            color: rgba(234,241,255,.82);
        }
        .btn-outline-secondary:hover, .btn-outline-secondary:focus { background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.32); color: #fff; transform: translateY(-1px); }

        .btn-outline-light {
            border-color: rgba(255,255,255,.30);
            color: rgba(234,241,255,.85);
        }
        .btn-outline-light:hover { background: rgba(255,255,255,.10); color: #fff; }

        .btn-outline-danger {
            border-color: rgba(239,68,68,.48);
            color: #f87171;
        }
        .btn-outline-danger:hover { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.68); color: #fca5a5; transform: translateY(-1px); }

        .btn-success {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            border: none; color: #fff; font-weight: 700;
        }
        .btn-success:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(34,197,94,.28); color: #fff; }

        .btn-dark {
            background: rgba(255,255,255,.10);
            border-color: rgba(255,255,255,.18);
            color: var(--mtms-text);
        }
        .btn-dark:hover { background: rgba(255,255,255,.16); color: #fff; }

        .btn-close { filter: invert(1) grayscale(1) brightness(1.4); }

        /* ── Alerts ── */
        .alert-danger  { background: rgba(239,68,68,.12);  border-color: rgba(239,68,68,.28);  color: #fca5a5; }
        .alert-success { background: rgba(34,197,94,.10);  border-color: rgba(34,197,94,.26);  color: #86efac; }
        .alert-info    { background: rgba(42,167,255,.10); border-color: rgba(42,167,255,.26); color: #93c5fd; }
        .alert-warning { background: rgba(245,166,35,.10); border-color: rgba(245,166,35,.26); color: #fcd34d; }
        .alert .btn-close { filter: invert(1) grayscale(1) brightness(1.4); }

        /* ── Dropdown ── */
        .dropdown-menu {
            background: #0d1b2e;
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: 0 16px 48px rgba(0,0,0,.5);
        }
        .dropdown-item { color: rgba(234,241,255,.85); transition: background .15s, color .15s; }
        .dropdown-item:hover, .dropdown-item:focus { background: rgba(255,255,255,.08); color: #fff; }
        .dropdown-item.text-danger { color: #f87171 !important; }
        .dropdown-divider { border-color: rgba(255,255,255,.10); }
        .dropdown-menu hr.dropdown-divider { border-color: rgba(255,255,255,.10); }

        /* ── Modal ── */
        .modal-content {
            background: rgba(7,20,40,.98);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 18px;
            color: var(--mtms-text);
        }
        .modal-header { border-bottom: 1px solid rgba(255,255,255,.10); }
        .modal-footer { border-top:   1px solid rgba(255,255,255,.10); }
        .modal-title  { color: #fff; }

        /* ── List group ── */
        .list-group-item, .list-group-item-action {
            background: rgba(255,255,255,.05);
            border-color: rgba(255,255,255,.10);
            color: var(--mtms-text);
        }
        .list-group-item-action:hover { background: rgba(255,255,255,.10); color: #fff; }

        /* ── Badges ── */
        .text-muted { color: var(--mtms-muted) !important; }
        .text-secondary { color: var(--mtms-muted) !important; }

        .badge-confirmed { background: rgba(34,197,94,.16);  color: #86efac; border: 1px solid rgba(34,197,94,.28); }
        .badge-pending   { background: rgba(245,166,35,.16); color: #fcd34d; border: 1px solid rgba(245,166,35,.28); }
        .badge-cancelled { background: rgba(239,68,68,.16);  color: #fca5a5; border: 1px solid rgba(239,68,68,.28); }

        .badge.bg-success     { background: rgba(34,197,94,.22)  !important; color: #86efac !important; }
        .badge.bg-secondary   { background: rgba(255,255,255,.14) !important; color: rgba(234,241,255,.80) !important; }
        .badge.bg-warning     { background: rgba(245,166,35,.22)  !important; color: #fcd34d !important; }
        .badge.bg-dark        { background: rgba(255,255,255,.12) !important; color: rgba(234,241,255,.85) !important; }
        .badge.bg-light       { background: rgba(255,255,255,.10) !important; color: rgba(234,241,255,.80) !important; border: 1px solid rgba(255,255,255,.15) !important; }
        .badge.text-bg-success   { background: rgba(34,197,94,.22)  !important; color: #86efac !important; }
        .badge.text-bg-secondary { background: rgba(255,255,255,.14) !important; color: rgba(234,241,255,.80) !important; }
        .badge.text-bg-light     { background: rgba(255,255,255,.10) !important; color: rgba(234,241,255,.80) !important; border: 1px solid rgba(255,255,255,.14) !important; }
        .badge.text-bg-warning   { background: rgba(245,166,35,.22)  !important; color: #fcd34d !important; }

        /* ── Movie cards ── */
        .movie-card {
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 14px;
            overflow: hidden;
            transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
            box-shadow: none;
            background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
        }
        .movie-card:hover {
            transform: translateY(-5px);
            border-color: rgba(214,178,94,.32);
            box-shadow: 0 18px 55px rgba(0,0,0,.50);
        }
        .movie-card .card-img-top { height: 300px; object-fit: cover; }
        .movie-card-placeholder {
            height: 300px;
            background: rgba(255,255,255,.06);
            display: flex; align-items: center; justify-content: center;
            color: rgba(234,241,255,.28); font-size: 3rem;
        }

        /* ── Hero ── */
        .mtms-hero {
            background: linear-gradient(135deg, var(--mtms-surface), var(--mtms-card));
            color: #fff;
            padding: 3.5rem 0 2.5rem;
            margin-bottom: 2rem;
            border-radius: 0 0 24px 24px;
        }

        /* ── Seat grid ── */
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(10, minmax(0, 1fr));
            gap: 8px;
            max-width: 780px;
        }
        .seat-label {
            display: block; text-align: center; padding: 8px 4px;
            border-radius: 8px; cursor: pointer; font-size: .8rem; font-weight: 600;
            user-select: none;
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .seat-label:hover { transform: scale(1.09); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
        .seat-normal  { background: rgba(42,167,255,.14);  color: rgba(234,241,255,.90); border: 1px solid rgba(42,167,255,.25); }
        .seat-couple  { background: rgba(214,178,94,.16);  color: rgba(234,241,255,.90); border: 1px solid rgba(214,178,94,.30); }
        .seat-booked  { background: rgba(255,255,255,.07); color: rgba(234,241,255,.30); cursor: not-allowed; border: 1px solid rgba(255,255,255,.07); }
        .seat-selected { outline: 2px solid var(--mtms-accent) !important; background: rgba(214,178,94,.24) !important; color: var(--mtms-text) !important; }
        .seat-couple-unit  { grid-column: span 2; }
        .seat-couple-hidden { display: none; }
        .screen-indicator {
            max-width: 780px;
            margin: 14px 0 18px;
            padding: 10px 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            letter-spacing: 2px;
            color: rgba(234,241,255,.55);
            background: linear-gradient(to bottom, rgba(255,255,255,.06), rgba(255,255,255,.03));
            border: 1px solid rgba(255,255,255,.10);
            font-size: .8rem;
        }

        /* ── Ticket stub ── */
        .ticket-stub {
            border: 2px dashed rgba(255,255,255,.15);
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
            max-width: 540px;
            color: var(--mtms-text);
        }
        .ticket-stub .stub-divider {
            border-top: 2px dashed rgba(255,255,255,.12);
            margin: 1.25rem 0;
        }
        .ticket-code-badge {
            background: rgba(255,255,255,.10);
            border: 1px solid rgba(255,255,255,.18);
            color: var(--mtms-text);
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            border-radius: 8px;
            padding: .5rem 1.25rem;
            display: inline-block;
        }

        /* ── Auth card ── */
        .auth-card { max-width: 440px; border-radius: 16px; }

        /* ── Footer ── */
        .mtms-footer {
            background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.65));
            color: var(--mtms-muted);
            font-size: .85rem;
            padding: 1.25rem 0;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,.06);
        }

        /* ── Hover / focus card glow ── */
        .card:hover { border-color: rgba(214,178,94,.18); }
        .shadow-sm { box-shadow: 0 4px 20px rgba(0,0,0,.35) !important; }

        /* ── Page fade-in animation ── */
        @keyframes mtmsFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        main.mtms-main > .container > * {
            animation: mtmsFadeIn .45s cubic-bezier(.2,.8,.2,1) both;
        }
        main.mtms-main > .container > *:nth-child(2) { animation-delay: .06s; }
        main.mtms-main > .container > *:nth-child(3) { animation-delay: .12s; }
        main.mtms-main > .container > *:nth-child(4) { animation-delay: .18s; }
        main.mtms-main > .container > *:nth-child(5) { animation-delay: .24s; }

        /* ── Skeleton loader ── */
        .mtms-skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.10), rgba(255,255,255,.05));
            background-size: 200% 100%;
            animation: mtmsShimmer 1.1s infinite linear;
            border-radius: 12px;
        }
        @keyframes mtmsShimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--mtms-dark); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.28); }

        /* ── Print ── */
        @media print { .no-print { display: none !important; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>

<header class="no-print">
    <nav class="navbar navbar-expand-lg mtms-nav">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-film me-1"></i>MTMS
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav me-auto ms-3 gap-1">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="bi bi-house-door me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/movies}">
                            <i class="bi bi-camera-video me-1"></i>Movies
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/movies(tab='COMING_SOON')}">
                            <i class="bi bi-hourglass-split me-1"></i>Coming Soon
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tickets/search}">
                            <i class="bi bi-search me-1"></i>Find Ticket
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/dashboard}">
                            <i class="bi bi-speedometer2 me-1"></i>Admin
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2" sec:authorize="isAnonymous()">
                    <a class="btn btn-outline-light btn-sm px-3" th:href="@{/login}">Login</a>
                    <a class="btn btn-primary btn-sm px-3 fw-semibold" th:href="@{/register}">Register</a>
                </div>
                <div class="dropdown ms-2" sec:authorize="isAuthenticated() and !hasRole('ADMIN')">
                    <button class="btn btn-sm dropdown-toggle d-flex align-items-center gap-2 px-3"
                            style="background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)"
                            data-bs-toggle="dropdown">
                        <span id="navAvatar" class="d-inline-flex align-items-center justify-content-center fw-bold"
                              style="width:26px;height:26px;border-radius:50%;background:var(--mtms-accent);color:#1b1408;font-size:.75rem">U</span>
                        <span id="navUserName" class="d-none d-md-inline" sec:authentication="name">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><a class="dropdown-item" th:href="@{/bookings/my-bookings}"><i class="bi bi-ticket-perforated me-2"></i>My Bookings</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button class="dropdown-item text-danger" type="submit">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
                <form class="d-flex ms-2" th:action="@{/logout}" method="post" sec:authorize="hasRole('ADMIN')">
                    <button class="btn btn-outline-light btn-sm px-3" type="submit">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>
</header>

<main class="mtms-main">
    <div class="container">
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:replace="${content}"></div>
    </div>
</main>

<footer class="mtms-footer no-print">
    <div class="container">
        <i class="bi bi-film me-1"></i>
        <strong style="color:#fff">MTMS</strong> &mdash; Movie Ticket Management System &copy; 2026
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var nameEl = document.getElementById('navUserName');
    var avatarEl = document.getElementById('navAvatar');
    if (nameEl && avatarEl) {
        avatarEl.textContent = nameEl.textContent.trim().charAt(0).toUpperCase() || 'U';
    }
</script>
</body>
</html>
