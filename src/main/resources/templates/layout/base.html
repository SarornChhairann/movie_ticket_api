<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — MTMS'">MTMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --mtms-dark: #0d0d0d;
            --mtms-surface: #1a1a2e;
            --mtms-card: #16213e;
            --mtms-accent: #e94560;
            --mtms-amber: #f5a623;
            --mtms-text: #e8e8e8;
            --mtms-muted: #8892a4;
        }

        body {
            background-color: #f4f6fb;
            color: #1a1a2e;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Navbar ── */
        .mtms-nav {
            background: linear-gradient(135deg, var(--mtms-dark) 0%, var(--mtms-surface) 100%);
            box-shadow: 0 2px 12px rgba(0,0,0,.4);
            padding: .75rem 0;
        }
        .mtms-nav .navbar-brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: .5px;
            color: var(--mtms-accent) !important;
        }
        .mtms-nav .nav-link {
            color: #cdd3de !important;
            font-weight: 500;
            transition: color .2s;
        }
        .mtms-nav .nav-link:hover { color: #fff !important; }

        /* ── Main ── */
        main.mtms-main { flex: 1; padding: 2.5rem 0; }

        /* ── Cards ── */
        .movie-card {
            border: none;
            border-radius: 14px;
            overflow: hidden;
            transition: transform .25s, box-shadow .25s;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
            background: #fff;
        }
        .movie-card:hover { transform: translateY(-5px); box-shadow: 0 10px 28px rgba(0,0,0,.13); }
        .movie-card .card-img-top { height: 300px; object-fit: cover; }
        .movie-card-placeholder {
            height: 300px;
            background: linear-gradient(135deg, #e9ecef, #dee2e6);
            display: flex; align-items: center; justify-content: center;
            color: #adb5bd; font-size: 3rem;
        }

        /* ── Hero ── */
        .mtms-hero {
            background: linear-gradient(135deg, var(--mtms-surface), var(--mtms-card));
            color: #fff;
            padding: 3.5rem 0 2.5rem;
            margin-bottom: 2rem;
            border-radius: 0 0 24px 24px;
        }

        /* ── Seat grid ── */
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(10, minmax(0, 1fr));
            gap: 8px;
            max-width: 780px;
        }
        .seat-label {
            display: block; text-align: center; padding: 8px 4px;
            border-radius: 8px; cursor: pointer; font-size: .8rem; font-weight: 600;
            user-select: none; transition: transform .1s;
        }
        .seat-label:hover { transform: scale(1.07); }
        .seat-normal  { background: #e9ecef; color: #495057; }
        .seat-couple  { background: #ffe8cc; color: #7c4f00; }
        .seat-booked  { background: #adb5bd; color: #fff; cursor: not-allowed; }
        .seat-selected { outline: 3px solid var(--mtms-accent); background: #ffd0d8 !important; }
        .seat-couple-unit { grid-column: span 2; }
        .seat-couple-hidden { display: none; }
        .screen-indicator {
            max-width: 780px;
            margin: 14px 0 18px;
            padding: 10px 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            letter-spacing: 2px;
            color: #495057;
            background: linear-gradient(to bottom, #f8f9fa, #dee2e6);
            border: 1px solid #ced4da;
            font-size: .8rem;
        }

        /* ── Ticket stub ── */
        .ticket-stub {
            border: 2px dashed #ced4da;
            border-radius: 16px;
            background: #fff;
            max-width: 540px;
        }
        .ticket-stub .stub-divider {
            border-top: 2px dashed #dee2e6;
            margin: 1.25rem 0;
        }
        .ticket-code-badge {
            background: var(--mtms-surface);
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            border-radius: 8px;
            padding: .5rem 1.25rem;
            display: inline-block;
        }

        /* ── Status badges ── */
        .badge-confirmed  { background: #d1fae5; color: #065f46; }
        .badge-pending    { background: #fef3c7; color: #92400e; }
        .badge-cancelled  { background: #fee2e2; color: #991b1b; }

        /* ── Forms ── */
        .auth-card { max-width: 440px; border-radius: 16px; border: none; }

        /* ── Footer ── */
        .mtms-footer {
            background: var(--mtms-dark);
            color: var(--mtms-muted);
            font-size: .85rem;
            padding: 1.25rem 0;
            text-align: center;
        }

        /* ── Print ── */
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<header class="no-print">
    <nav class="navbar navbar-expand-lg mtms-nav">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-film me-1"></i>MTMS
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav me-auto ms-3 gap-1">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="bi bi-house-door me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/movies}">
                            <i class="bi bi-camera-video me-1"></i>Movies
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/movies(tab='COMING_SOON')}">
                            <i class="bi bi-hourglass-split me-1"></i>Coming Soon
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tickets/search}">
                            <i class="bi bi-search me-1"></i>Find Ticket
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/dashboard}">
                            <i class="bi bi-speedometer2 me-1"></i>Admin
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2" sec:authorize="isAnonymous()">
                    <a class="btn btn-outline-light btn-sm px-3" th:href="@{/login}">Login</a>
                    <a class="btn btn-sm px-3" style="background:var(--mtms-accent);color:#fff;border:none" th:href="@{/register}">Register</a>
                </div>
                <div class="dropdown ms-2" sec:authorize="isAuthenticated() and !hasRole('ADMIN')">
                    <button class="btn btn-sm dropdown-toggle d-flex align-items-center gap-2 px-3"
                            style="background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)"
                            data-bs-toggle="dropdown">
                        <span id="navAvatar" class="d-inline-flex align-items-center justify-content-center fw-bold"
                              style="width:26px;height:26px;border-radius:50%;background:var(--mtms-accent);font-size:.75rem">U</span>
                        <span id="navUserName" class="d-none d-md-inline" sec:authentication="name">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><a class="dropdown-item" th:href="@{/bookings/my-bookings}"><i class="bi bi-ticket-perforated me-2"></i>My Bookings</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button class="dropdown-item text-danger" type="submit">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
                <form class="d-flex ms-2" th:action="@{/logout}" method="post" sec:authorize="hasRole('ADMIN')">
                    <button class="btn btn-outline-light btn-sm px-3" type="submit">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>
</header>

<main class="mtms-main">
    <div class="container">
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:replace="${content}"></div>
    </div>
</main>

<footer class="mtms-footer no-print">
    <div class="container">
        <i class="bi bi-film me-1"></i>
        <strong style="color:#fff">MTMS</strong> &mdash; Movie Ticket Management System &copy; 2026
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var nameEl = document.getElementById('navUserName');
    var avatarEl = document.getElementById('navAvatar');
    if (nameEl && avatarEl) {
        avatarEl.textContent = nameEl.textContent.trim().charAt(0).toUpperCase() || 'U';
    }
</script>
</body>
</html>
