<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Find Ticket', ~{::content})}">
<th:block th:fragment="content">
    <div class="card auth-card shadow-sm mx-auto">
        <div class="card-body p-4">
            <h3 class="mb-2">Find Your Ticket</h3>
            <p class="text-muted mb-4">Enter your ticket number to open your e-ticket.</p>

            <form th:action="@{/tickets}" method="get">
                <div class="mb-3">
                    <label for="ticketCode" class="form-label">Ticket Number</label>
                    <input id="ticketCode"
                           name="ticketCode"
                           class="form-control"
                           placeholder="e.g. 2f8e4ad3-xxxx-xxxx-xxxx-7a3c9f3b2e1d"
                           required>
                </div>
                <button type="submit" class="btn btn-dark w-100">
                    <i class="bi bi-search me-1"></i>Search Ticket
                </button>
            </form>
        </div>
    </div>
</th:block>
</html>
