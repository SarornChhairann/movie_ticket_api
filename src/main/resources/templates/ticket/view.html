<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('E-Ticket', ~{::content})}">
<th:block th:fragment="content">
    <div style="max-width:520px;margin:0 auto">
        <div class="ticket-stub p-0 overflow-hidden">
            <!-- Header strip -->
            <div style="background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:1.5rem 1.75rem">
                <div class="d-flex justify-content-between align-items-center">
                    <span style="font-size:.75rem;letter-spacing:1.5px;text-transform:uppercase;opacity:.7">E-Ticket</span>
                    <i class="bi bi-film" style="font-size:1.4rem;opacity:.6"></i>
                </div>
                <h4 class="fw-bold mt-2 mb-0" th:text="${ticket.booking.showtime.movie.title}"></h4>
            </div>

            <!-- Body -->
            <div class="p-4">
                <div class="row g-3 mb-1">
                    <div class="col-6">
                        <div class="text-muted" style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px">Date</div>
                        <div class="fw-semibold" th:text="${ticket.booking.showtime.showDate}"></div>
                    </div>
                    <div class="col-6">
                        <div class="text-muted" style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px">Time</div>
                        <div class="fw-semibold" th:text="${ticket.booking.showtime.showTime}"></div>
                    </div>
                    <div class="col-6">
                        <div class="text-muted" style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px">Hall</div>
                        <div class="fw-semibold" th:text="${ticket.booking.showtime.hall.name}"></div>
                    </div>
                    <div class="col-6">
                        <div class="text-muted" style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px">Seat</div>
                        <div class="fw-semibold">
                            <span th:text="${ticket.seat.seatCode}"></span>
                            <span class="badge ms-1"
                                  style="background:#ffe8cc;color:#7c4f00;font-size:.7rem"
                                  th:if="${ticket.seat.seatType.name() == 'COUPLE'}">Couple</span>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="text-muted" style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px">Customer</div>
                        <div class="fw-semibold" th:text="${ticket.booking.user != null} ? ${ticket.booking.user.name} : (${ticket.booking.guestName != null} ? ${ticket.booking.guestName} : 'Guest')"></div>
                    </div>
                </div>

                <div class="stub-divider"></div>

                <div class="text-center">
                    <div class="text-muted mb-1" style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px">Ticket Code</div>
                    <div class="ticket-code-badge" th:text="${ticket.ticketCode}"></div>
                    <div class="text-muted mt-2" style="font-size:.75rem">
                        Booking ref: <span th:text="'#' + ${ticket.booking.id}"></span>
                    </div>
                </div>

                <!-- QR Code -->
                <div class="text-center mt-3">
                    <div class="text-muted mb-2" style="font-size:.72rem;text-transform:uppercase;letter-spacing:.8px">Scan at Cinema Door</div>
                    <img th:src="@{/tickets/{code}/qr(code=${ticket.ticketCode})}"
                         alt="QR Code" width="160" height="160"
                         style="border:1px solid #e2e8f0;border-radius:8px;padding:6px;background:#fff">
                </div>

                <!-- Scanned badge -->
                <div th:if="${ticket.scannedAt != null}" class="text-center mt-3">
                    <span class="badge bg-secondary px-3 py-2" style="font-size:.82rem">
                        <i class="bi bi-check2-circle me-1"></i>
                        Scanned at <span th:text="${#temporals.format(ticket.scannedAt, 'dd MMM yyyy HH:mm')}"></span>
                    </span>
                </div>
            </div>
        </div>

        <div class="text-center mt-3 no-print d-flex gap-2 justify-content-center flex-wrap">
            <a class="btn btn-dark px-4 fw-semibold"
               th:href="@{/tickets/{code}/pdf(code=${ticket.ticketCode})}">
                <i class="bi bi-file-earmark-pdf me-1"></i>Download PDF
            </a>
            <button class="btn btn-outline-secondary px-4" onclick="window.print()">
                <i class="bi bi-printer me-1"></i>Print
            </button>
            <a class="btn btn-outline-secondary px-4" th:href="@{/movies}">
                <i class="bi bi-house me-1"></i>Home
            </a>
        </div>
    </div>
</th:block>
</html>
