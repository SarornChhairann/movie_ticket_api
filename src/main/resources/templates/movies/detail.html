<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${movie.title}, ~{::content})}">
<th:block th:fragment="content">
    <a class="btn btn-outline-secondary btn-sm mb-4 no-print" th:href="@{/movies}">
        <i class="bi bi-arrow-left me-1"></i>All Movies
    </a>

    <!-- Movie header -->
    <div class="card border-0 shadow-sm rounded-4 mb-4 overflow-hidden">
        <div class="row g-0">
            <div class="col-md-3" th:if="${movie.imagePath != null and !#strings.isEmpty(movie.imagePath)}">
                <img th:src="${movie.imagePath}" alt="Movie poster"
                     style="width:100%;height:100%;object-fit:cover;min-height:260px;">
            </div>
            <div th:classappend="${movie.imagePath != null and !#strings.isEmpty(movie.imagePath)} ? 'col-md-9' : 'col-12'"
                 class="p-4 d-flex flex-column justify-content-center">
                <div class="d-flex flex-wrap gap-1 mb-2">
                    <span class="badge" style="background:rgba(42,167,255,.14);color:rgba(234,241,255,.85);border:1px solid rgba(42,167,255,.22)" th:text="${movie.genre}"></span>
                    <span th:if="${movie.format != null and !#strings.isEmpty(movie.format)}"
                          class="badge bg-dark" th:text="${movie.format}"></span>
                    <span th:if="${movie.rating != null and !#strings.isEmpty(movie.rating)}"
                          class="badge bg-warning" th:text="${movie.rating}"></span>
                </div>
                <h2 class="fw-bold mb-2" th:text="${movie.title}"></h2>
                <p class="text-muted mb-2" style="font-size:.9rem">
                    <i class="bi bi-clock me-1"></i>
                    <span th:text="${movie.durationMinutes} + ' min'"></span>
                    <span th:if="${movie.language != null and !#strings.isEmpty(movie.language)}"
                          class="ms-3"><i class="bi bi-translate me-1"></i><span th:text="${movie.language}"></span></span>
                </p>
                <p th:if="${movie.description != null and !#strings.isEmpty(movie.description)}"
                   class="mb-2 text-secondary" th:text="${movie.description}"></p>
                <p th:if="${movie.cast != null and !#strings.isEmpty(movie.cast)}"
                   class="mb-0 text-muted" style="font-size:.85rem">
                    <i class="bi bi-people me-1"></i><span th:text="${movie.cast}"></span>
                </p>
            </div>
        </div>
    </div>

    <!-- Trailer -->
    <div th:if="${movie.trailerUrl != null and !#strings.isEmpty(movie.trailerUrl)}" class="mb-4">
        <h5 class="fw-bold mb-3"><i class="bi bi-play-circle me-2"></i>Trailer</h5>
        <div class="ratio ratio-16x9 rounded-4 overflow-hidden shadow-sm" style="max-width:640px">
            <iframe th:src="${movie.trailerUrl}" allowfullscreen title="Movie Trailer"></iframe>
        </div>
    </div>

    <!-- Showtimes -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
        <h5 class="fw-bold mb-0"><i class="bi bi-calendar3 me-2"></i>Showtimes</h5>
        <form method="get" class="d-flex align-items-center gap-2" style="font-size:.88rem">
            <label class="text-muted fw-semibold mb-0">City:</label>
            <select name="city" class="form-select form-select-sm" style="min-width:140px"
                    onchange="this.form.submit()">
                <option value="" th:selected="${selectedCity == null or #strings.isEmpty(selectedCity)}">All Cities</option>
                <option th:each="c : ${cities}" th:value="${c}" th:text="${c}"
                        th:selected="${c == selectedCity}"></option>
            </select>
        </form>
    </div>
    <div th:if="${#maps.isEmpty(showtimeByDate)}" class="alert alert-info rounded-3" style="border-radius:12px">
        <i class="bi bi-info-circle me-2"></i>No showtimes
        <span th:if="${selectedCity != null and !#strings.isEmpty(selectedCity)}">
            in <strong th:text="${selectedCity}"></strong>
        </span>
        scheduled yet. Check back soon!
    </div>

    <div th:each="entry : ${showtimeByDate}" class="mb-4">
        <div class="d-flex align-items-center gap-2 mb-2">
            <i class="bi bi-calendar-event" style="color:var(--mtms-accent)"></i>
            <span class="fw-semibold" th:text="${entry.key}"></span>
        </div>
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <table class="table mb-0 align-middle">
                <thead>
                <tr>
                    <th>Time</th>
                    <th>Hall</th>
                    <th>Normal</th>
                    <th>Couple</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="showtime : ${entry.value}">
                    <td class="fw-semibold" th:text="${showtime.showTime}"></td>
                    <td th:text="${showtime.hall.name}"></td>
                    <td><span class="badge bg-light" th:text="'$' + ${showtime.normalPrice}"></span></td>
                    <td><span class="badge" style="background:rgba(214,178,94,.18);color:var(--mtms-accent);border:1px solid rgba(214,178,94,.28)" th:text="'$' + ${showtime.couplePrice}"></span></td>
                    <td class="text-end">
                        <a class="btn btn-primary btn-sm px-3 fw-semibold"
                           th:href="@{/bookings/seats/{id}(id=${showtime.id})}">
                            <i class="bi bi-ticket-perforated me-1"></i>Select Seats
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</html>
