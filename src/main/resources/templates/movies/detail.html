<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${movie.title}, ~{::content})}">
<th:block th:fragment="content">
    <a class="btn btn-outline-secondary btn-sm mb-4 no-print" th:href="@{/movies}">
        <i class="bi bi-arrow-left me-1"></i>All Movies
    </a>

    <!-- Movie header -->
    <div class="card border-0 shadow-sm rounded-4 mb-4 overflow-hidden">
        <div class="row g-0">
            <div class="col-md-3" th:if="${movie.imagePath != null and !#strings.isEmpty(movie.imagePath)}">
                <img th:src="${movie.imagePath}" alt="Movie poster"
                     style="width:100%;height:100%;object-fit:cover;min-height:260px;">
            </div>
            <div th:classappend="${movie.imagePath != null and !#strings.isEmpty(movie.imagePath)} ? 'col-md-9' : 'col-12'"
                 class="p-4 d-flex flex-column justify-content-center">
                <span class="badge mb-2" style="background:#f0f4ff;color:#4338ca;align-self:flex-start"
                      th:text="${movie.genre}"></span>
                <h2 class="fw-bold mb-2" th:text="${movie.title}"></h2>
                <p class="text-muted mb-3">
                    <i class="bi bi-clock me-1"></i>
                    <span th:text="${movie.durationMinutes} + ' min'"></span>
                </p>
                <p th:if="${movie.description != null and !#strings.isEmpty(movie.description)}"
                   class="mb-0 text-secondary" th:text="${movie.description}"></p>
            </div>
        </div>
    </div>

    <!-- Showtimes -->
    <h5 class="fw-bold mb-3"><i class="bi bi-calendar3 me-2"></i>Showtimes</h5>
    <div th:if="${#maps.isEmpty(showtimeByDate)}" class="alert alert-info rounded-3">
        <i class="bi bi-info-circle me-2"></i>No showtimes scheduled yet. Check back soon!
    </div>

    <div th:each="entry : ${showtimeByDate}" class="mb-4">
        <div class="d-flex align-items-center gap-2 mb-2">
            <i class="bi bi-calendar-event text-primary"></i>
            <span class="fw-semibold" th:text="${entry.key}"></span>
        </div>
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <table class="table mb-0 align-middle">
                <thead style="background:#f8fafc">
                <tr>
                    <th>Time</th>
                    <th>Hall</th>
                    <th>Normal</th>
                    <th>Couple</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="showtime : ${entry.value}">
                    <td class="fw-semibold" th:text="${showtime.showTime}"></td>
                    <td th:text="${showtime.hall.name}"></td>
                    <td><span class="badge bg-light text-dark border" th:text="'$' + ${showtime.normalPrice}"></span></td>
                    <td><span class="badge" style="background:#fff3cd;color:#7c4f00;border:1px solid #ffc107" th:text="'$' + ${showtime.couplePrice}"></span></td>
                    <td class="text-end">
                        <a class="btn btn-primary btn-sm px-3 fw-semibold"
                           th:href="@{/bookings/seats/{id}(id=${showtime.id})}">
                            <i class="bi bi-ticket-perforated me-1"></i>Select Seats
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</html>
