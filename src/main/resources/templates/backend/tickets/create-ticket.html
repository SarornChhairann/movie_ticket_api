<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{backend/layout/base :: base}">
<head>
    <title>Create Ticket - Ticket Management System</title>
</head>
<body>
    <th:block th:fragment="content">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>
                Create New Ticket
                <small>Add a new ticket to the system</small>
            </h1>
            <ol class="breadcrumb">
                <li><a th:href="@{/backend}"><i class="fa fa-dashboard"></i> Home</a></li>
                <li><a th:href="@{/backend/tickets}">Tickets</a></li>
                <li class="active">Create Ticket</li>
            </ol>
        </section>

        <!-- Main content -->
        <section class="content">
            <div class="row">
                <div class="col-md-12">
                    <!-- general form elements -->
                    <div class="box box-primary">
                        <div class="box-header with-border">
                            <h3 class="box-title"><i class="fa fa-ticket"></i> Ticket Information</h3>
                        </div>
                        <!-- /.box-header -->
                        <!-- form start -->
                        <form th:action="@{/backend/tickets}" th:object="${ticket}" method="post">
                            <div class="box-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="subject">Subject <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="subject" th:field="*{title}" placeholder="Enter ticket subject" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="category">Category <span class="text-danger">*</span></label>
                                            <select class="form-control" id="category" th:field="*{categoryId}" required>
                                                <option value="">Select Category</option>
                                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="priority">Priority <span class="text-danger">*</span></label>
                                            <select class="form-control" id="priority" th:field="*{priority}" required>
                                                <option value="">Select Priority</option>
                                                <option value="low">Low</option>
                                                <option value="medium">Medium</option>
                                                <option value="high">High</option>
                                                <option value="urgent">Urgent</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="status">Status</label>
                                            <select class="form-control" id="status" th:field="*{status}">
                                                <option value="open">Open</option>
                                                <option value="in_progress">In Progress</option>
                                                <option value="resolved">Resolved</option>
                                                <option value="closed">Closed</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="assignee">Assignee</label>
                                            <select class="form-control" id="assignee" th:field="*{assigneeId}">
                                                <option value="">Unassigned</option>
                                                <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.name}">User</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="description">Description <span class="text-danger">*</span></label>
                                    <textarea class="form-control" id="description" rows="8" th:field="*{description}" placeholder="Enter detailed description of the issue..." required></textarea>
                                </div>

                                <div class="form-group">
                                    <label for="tags">Tags</label>
                                    <input type="text" class="form-control" id="tags" th:field="*{tags}" placeholder="Enter tags separated by commas (e.g., login, authentication, bug)">
                                    <small class="form-text text-muted">Separate multiple tags with commas</small>
                                </div>

                                <div class="form-group">
                                    <label for="attachments">Attachments</label>
                                    <div class="input-group">
                                        <input type="file" class="form-control" id="attachments" name="attachments" multiple>
                                    </div>
                                    <small class="form-text text-muted">You can attach multiple files (max 10MB each)</small>
                                </div>

                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>Related Tickets</label>
                                            <input type="text" class="form-control" th:field="*{relatedTickets}" placeholder="Enter ticket IDs (e.g., TKT-001, TKT-002)">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>Due Date</label>
                                            <input type="date" class="form-control" id="dueDate" th:field="*{dueDate}">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- /.box-body -->

                            <div class="box-footer">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fa fa-save"></i> Create Ticket
                                </button>
                                <a th:href="@{/backend/tickets}" class="btn btn-default">
                                    <i class="fa fa-times"></i> Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                    <!-- /.box -->
                </div>
            </div>
        </section>
        <!-- /.content -->
    </th:block>
    
    <th:block th:fragment="pageScripts">
        <!-- Page-specific scripts if needed -->
    </th:block>
</body>
</html>
