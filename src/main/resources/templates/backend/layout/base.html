<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="base">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title th:text="${pageTitle != null ? pageTitle + ' - Ticket Management System' : 'Ticket Management System'}">Ticket Management System</title>
    <!-- Tell the browser to be responsive to screen width -->
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    
    <!-- Bootstrap 3.3.5 -->
    <link rel="stylesheet" th:href="@{bootstrap/css/bootstrap.min.css}">
    <!-- Font Awesome -->
    <link rel="stylesheet" th:href="@{https://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css}">
    <!-- Ionicons -->
    <link rel="stylesheet" th:href="@{https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css}">
    <!-- Theme style -->
    <link rel="stylesheet" th:href="@{dist/css/AdminLTE.min.css}">
    <!-- AdminLTE Skins. Choose a skin from the css/skins folder instead of downloading all of them to reduce the load. -->
    <link rel="stylesheet" th:href="@{dist/css/skins/_all-skins.min.css}">
    <!-- iCheck -->
    <link rel="stylesheet" th:href="@{plugins/iCheck/flat/blue.css}">
    <!-- Morris chart -->
    <link rel="stylesheet" th:href="@{plugins/morris/morris.css}">
    <!-- jvectormap -->
    <link rel="stylesheet" th:href="@{plugins/jvectormap/jquery-jvectormap-1.2.2.css}">
    <!-- Date Picker -->
    <link rel="stylesheet" th:href="@{plugins/datepicker/datepicker3.css}">
    <!-- Daterange picker -->
    <link rel="stylesheet" th:href="@{plugins/daterangepicker/daterangepicker-bs3.css}">
    <!-- bootstrap wysihtml5 - text editor -->
    <link rel="stylesheet" th:href="@{plugins/bootstrap-wysihtml5/bootstrap3-wysihtml5.min.css}">
    <!-- DataTables -->
    <link rel="stylesheet" th:href="@{plugins/datatables/dataTables.bootstrap.css}">
    <!-- Select2 -->
    <link rel="stylesheet" th:href="@{plugins/select2/select2.min.css}">
    
    <!-- Additional page-specific CSS -->
    <th:block th:include="this :: pageCss">
        <!-- Page-specific CSS goes here -->
    </th:block>
</head>
<body class="hold-transition skin-blue sidebar-mini">
<div class="wrapper">
    <!-- Header -->
    <header th:replace="backend/layout/header :: header"></header>
    
    <!-- Left side column. contains the logo and sidebar -->
    <aside th:replace="backend/layout/main-sidebar :: main-sidebar"></aside>

    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Page-specific content header and content -->
        <th:block th:include="this :: content">
            <!-- Default content - should be overridden by pages -->
        </th:block>
    </div>
    <!-- /.content-wrapper -->

    <!-- Footer -->
    <footer th:replace="backend/layout/footer :: footer"></footer>

    <!-- Control Sidebar -->
    <aside th:replace="backend/layout/control-sidebar :: control-sidebar"></aside>
</div><!-- ./wrapper -->

<!-- jQuery 2.1.4 -->
<script th:src="@{plugins/jQuery/jQuery-2.1.4.min.js}"></script>
<!-- jQuery UI 1.11.4 -->
<script th:src="@{https://code.jquery.com/ui/1.11.4/jquery-ui.min.js}"></script>
<!-- Resolve conflict in jQuery UI tooltip with Bootstrap tooltip -->
<script>
    $.widget.bridge('uibutton', $.ui.button);
</script>
<!-- Bootstrap 3.3.5 -->
<script th:src="@{bootstrap/js/bootstrap.min.js}"></script>
<!-- Morris.js charts -->
<script th:src="@{https://cdnjs.cloudflare.com/ajax/libs/raphael/2.1.0/raphael-min.js}"></script>
<script th:src="@{plugins/morris/morris.min.js}"></script>
<!-- Sparkline -->
<script th:src="@{plugins/sparkline/jquery.sparkline.min.js}"></script>
<!-- jvectormap -->
<script th:src="@{plugins/jvectormap/jquery-jvectormap-1.2.2.min.js}"></script>
<script th:src="@{plugins/jvectormap/jquery-jvectormap-world-mill-en.js}"></script>
<!-- jQuery Knob Chart -->
<script th:src="@{plugins/knob/jquery.knob.js}"></script>
<!-- daterangepicker -->
<script th:src="@{https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.10.2/moment.min.js}"></script>
<script th:src="@{plugins/daterangepicker/daterangepicker.js}"></script>
<!-- datepicker -->
<script th:src="@{plugins/datepicker/bootstrap-datepicker.js}"></script>
<!-- Bootstrap WYSIHTML5 -->
<script th:src="@{plugins/bootstrap-wysihtml5/bootstrap3-wysihtml5.all.min.js}"></script>
<!-- Slimscroll -->
<script th:src="@{plugins/slimScroll/jquery.slimscroll.min.js}"></script>
<!-- FastClick -->
<script th:src="@{plugins/fastclick/fastclick.min.js}"></script>
<!-- AdminLTE App -->
<script th:src="@{dist/js/app.min.js}"></script>
<!-- DataTables -->
<script th:src="@{plugins/datatables/jquery.dataTables.min.js}"></script>
<script th:src="@{plugins/datatables/dataTables.bootstrap.min.js}"></script>
<!-- Select2 -->
<script th:src="@{plugins/select2/select2.full.min.js}"></script>

<!-- Additional page-specific scripts -->
<th:block th:include="this :: pageScripts">
    <!-- Page-specific scripts go here -->
</th:block>
</body>
</html>
