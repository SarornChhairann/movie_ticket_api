<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Page Not Found', ~{::content})}">
<th:block th:fragment="content">
    <div class="text-center py-5">
        <div class="fw-black mb-2" style="font-size:6rem;line-height:1;color:#e2e8f0">404</div>
        <h3 class="fw-bold mb-2">Page not found</h3>
        <p class="text-muted mb-4">The page you're looking for doesn't exist or has been moved.</p>
        <a class="btn btn-primary px-5 fw-semibold" th:href="@{/movies}">
            <i class="bi bi-house me-1"></i>Back to Movies
        </a>
    </div>
</th:block>
</html>
