<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('My Profile', ~{::content})}">
<th:block th:fragment="content">
    <h4 class="fw-bold mb-4"><i class="bi bi-person-circle me-2"></i>My Profile</h4>

    <div class="row g-4" style="max-width:800px">
        <!-- Profile info -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <h6 class="fw-bold mb-3" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.8px;color:var(--mtms-muted)">
                    Account Details
                </h6>

                <div th:if="${success}" class="alert alert-success alert-dismissible fade show py-2" role="alert">
                    <i class="bi bi-check-circle me-1"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show py-2" role="alert">
                    <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/profile}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" style="font-size:.88rem">Email</label>
                        <input class="form-control" type="email" th:value="${user.email}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" style="font-size:.88rem">Full Name</label>
                        <input class="form-control" type="text" name="name" th:value="${user.name}"
                               placeholder="Your name" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold" style="font-size:.88rem">Phone</label>
                        <input class="form-control" type="tel" name="phone" th:value="${user.phone}"
                               placeholder="+855 12 345 678">
                    </div>
                    <button class="btn btn-primary px-4 fw-semibold" type="submit">
                        <i class="bi bi-save me-1"></i>Save Changes
                    </button>
                </form>
            </div>
        </div>

        <!-- Change password -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <h6 class="fw-bold mb-3" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.8px;color:var(--mtms-muted)">
                    Change Password
                </h6>

                <div th:if="${pwSuccess}" class="alert alert-success alert-dismissible fade show py-2" role="alert">
                    <i class="bi bi-check-circle me-1"></i><span th:text="${pwSuccess}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${pwError}" class="alert alert-danger alert-dismissible fade show py-2" role="alert">
                    <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${pwError}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/profile/change-password}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" style="font-size:.88rem">Current Password</label>
                        <input class="form-control" type="password" name="currentPassword" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" style="font-size:.88rem">New Password</label>
                        <input class="form-control" type="password" name="newPassword" minlength="6" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold" style="font-size:.88rem">Confirm New Password</label>
                        <input class="form-control" type="password" name="confirmPassword" required>
                    </div>
                    <button class="btn btn-outline-primary px-4 fw-semibold" type="submit">
                        <i class="bi bi-key me-1"></i>Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</th:block>
</html>
