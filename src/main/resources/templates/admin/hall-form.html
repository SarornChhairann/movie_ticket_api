<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Hall Form', ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex align-items-center gap-2 mb-4">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/halls}"><i class="bi bi-arrow-left"></i></a>
        <h4 class="fw-bold mb-0" th:text="${hall.id == null} ? 'New Hall' : 'Edit Hall'">Hall</h4>
    </div>
    <div class="admin-form-card card p-4" style="max-width:480px">
        <form th:action="@{/admin/halls/save}" th:object="${hall}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Name</label>
                <input class="form-control" th:field="*{name}" placeholder="Hall name" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">City</label>
                <input class="form-control" th:field="*{city}" placeholder="e.g. Phnom Penh">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Address</label>
                <input class="form-control" th:field="*{address}" placeholder="Street address">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Total Seats</label>
                <input class="form-control" type="number" th:field="*{totalSeats}" min="1" placeholder="60">
                <div class="form-text">Default 60 seats (4 rows × 15: 10 couple + 5 normal per row).</div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary px-4" type="submit"><i class="bi bi-save me-1"></i>Save</button>
                <a class="btn btn-outline-secondary px-4" th:href="@{/admin/halls}">Cancel</a>
            </div>
        </form>
    </div>
</th:block>
</html>
