<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Hall Form', ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex align-items-center gap-2 mb-4">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/halls}"><i class="bi bi-arrow-left"></i></a>
        <h4 class="fw-bold mb-0" th:text="${hall.id == null} ? 'New Hall' : 'Edit Hall'">Hall</h4>
    </div>
    <div class="admin-form-card card p-4" style="max-width:560px">
        <div th:if="${error}" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        </div>
        <form th:action="@{/admin/halls/save}" th:object="${hall}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Cinema</label>
                <select class="form-select" th:field="*{cinema.id}" required>
                    <option value="">— Select cinema —</option>
                    <option th:each="c : ${cinemas}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Name</label>
                <input class="form-control" th:field="*{name}" placeholder="Hall name" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Type</label>
                <select class="form-select" th:field="*{type}">
                    <option value="">— Select type —</option>
                    <option value="Standard">Standard</option>
                    <option value="Smart Hall">Smart Hall</option>
                    <option value="Gold Class">Gold Class</option>
                    <option value="Diamond Class">Diamond Class</option>
                    <option value="Giant Screen">Giant Screen</option>
                    <option value="ScreenX">ScreenX</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">City</label>
                <input class="form-control" th:field="*{city}" placeholder="e.g. Phnom Penh">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Address</label>
                <input class="form-control" th:field="*{address}" placeholder="Street address">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Total Seats</label>
                <input class="form-control" type="number" th:field="*{totalSeats}" min="1" placeholder="60">
                <div class="form-text">Default 60 seats (4 rows × 15: 10 couple + 5 normal per row).</div>
            </div>
            <div class="mb-4 d-flex flex-wrap gap-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{hasDolbyAtmos}" id="hasDolbyAtmos">
                    <label class="form-check-label" for="hasDolbyAtmos">Dolby Atmos</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{hasScreenX}" id="hasScreenX">
                    <label class="form-check-label" for="hasScreenX">ScreenX</label>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary px-4" type="submit"><i class="bi bi-save me-1"></i>Save</button>
                <a class="btn btn-outline-secondary px-4" th:href="@{/admin/halls}">Cancel</a>
            </div>
        </form>
    </div>
</th:block>
</html>
