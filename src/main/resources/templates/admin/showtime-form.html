<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Showtime Form', ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex align-items-center gap-2 mb-4">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/showtimes}"><i class="bi bi-arrow-left"></i></a>
        <h4 class="fw-bold mb-0">New Showtime</h4>
    </div>
    <div class="admin-form-card card p-4" style="max-width:560px">
        <div th:if="${error}" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        </div>
        <form th:action="@{/admin/showtimes/save}" th:object="${showtime}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Movie</label>
                <select class="form-select" name="movie.id" required>
                    <option value="">— Select movie —</option>
                    <option th:each="movie : ${movies}" th:value="${movie.id}"
                            th:text="${movie.title} + ' (' + ${movie.status} + ')'"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Hall</label>
                <select class="form-select" name="hall.id" required>
                    <option value="">— Select hall —</option>
                    <option th:each="hall : ${halls}" th:value="${hall.id}"
                            th:text="${hall.city != null and !#strings.isEmpty(hall.city)} ? (${hall.city} + ' — ' + ${hall.name}) : ${hall.name}"></option>
                </select>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Date</label>
                    <input class="form-control" type="date" th:field="*{showDate}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Time</label>
                    <input class="form-control" type="time" th:field="*{showTime}" required>
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Normal Price ($)</label>
                    <input class="form-control" type="number" step="0.01" min="0" th:field="*{normalPrice}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Couple Price ($)</label>
                    <input class="form-control" type="number" step="0.01" min="0" th:field="*{couplePrice}" required>
                </div>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="publishNow" name="publishNow"
                       th:checked="${publishNow == null or publishNow}">
                <label class="form-check-label fw-semibold" for="publishNow">Publish now (bookable)</label>
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="sendNotification" name="sendNotification"
                       th:checked="${sendNotification != null and sendNotification}">
                <label class="form-check-label fw-semibold" for="sendNotification">Send notification to users</label>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary px-4" type="submit"><i class="bi bi-save me-1"></i>Save</button>
                <a class="btn btn-outline-secondary px-4" th:href="@{/admin/showtimes}">Cancel</a>
            </div>
        </form>
    </div>
</th:block>
</html>
