<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Notifications', ~{::content})}">
<th:block th:fragment="content">
    <h4 class="fw-bold mb-4"><i class="bi bi-bell me-2"></i>Notifications</h4>

    <!-- Send form -->
    <div class="admin-form-card card p-4 mb-4">
        <h6 class="fw-semibold mb-3">Broadcast to All Users</h6>
        <form th:action="@{/admin/notifications/send}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold" style="font-size:.85rem">Title</label>
                <input type="text" name="title" class="form-control" placeholder="Notification title" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold" style="font-size:.85rem">Message</label>
                <textarea name="message" class="form-control" rows="3" placeholder="Write your message…" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-send me-1"></i>Send to All Users
            </button>
        </form>
    </div>

    <!-- History -->
    <h5 class="fw-bold mb-3">Sent History</h5>
    <div class="admin-table">
        <table class="table mb-0 align-middle">
            <thead>
            <tr>
                <th>#</th>
                <th>Title</th>
                <th>Message</th>
                <th>Target</th>
                <th>Recipients</th>
                <th>Sent At</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="n : ${notifications}">
                <td class="text-muted" th:text="${n.id}"></td>
                <td class="fw-semibold" th:text="${n.title}"></td>
                <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" th:text="${n.message}"></td>
                <td><span class="badge bg-info text-dark" th:text="${n.targetType}"></span></td>
                <td th:text="${n.sentCount}"></td>
                <td><small th:text="${#temporals.format(n.sentAt, 'dd MMM yyyy HH:mm')}"></small></td>
                <td class="text-end">
                    <form th:action="@{/admin/notifications/{id}/delete(id=${n.id})}" method="post" class="d-inline"
                          data-confirm="Delete this notification record?"
                          data-confirm-title="Delete notification"
                          data-confirm-ok="Delete"
                          data-confirm-cancel="Cancel"
                          data-confirm-danger="true">
                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(notifications)}">
                <td colspan="7" class="text-center text-muted py-4">No notifications sent yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</html>
