<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Food Item', ~{::content})}">
<th:block th:fragment="content">
    <a class="btn btn-outline-secondary btn-sm mb-4" th:href="@{/admin/food-items}">
        <i class="bi bi-arrow-left me-1"></i>Back
    </a>
    <h4 class="fw-bold mb-4" th:text="${foodItem.id == null} ? 'New Food Item' : 'Edit Food Item'"></h4>

    <div class="card border-0 shadow-sm rounded-4" style="max-width:560px">
        <div class="card-body p-4">
            <form th:action="@{/admin/food-items/save}" method="post" th:object="${foodItem}">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Name</label>
                    <input class="form-control" type="text" th:field="*{name}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    <input class="form-control" type="text" th:field="*{description}" placeholder="e.g. Large popcorn with butter">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Price ($)</label>
                    <input class="form-control" type="number" step="0.01" min="0" th:field="*{price}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Image URL</label>
                    <input class="form-control" type="url" th:field="*{imageUrl}" placeholder="https://...">
                </div>
                <div class="mb-4 form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{available}" id="availableCheck">
                    <label class="form-check-label fw-semibold" for="availableCheck">Available for purchase</label>
                </div>
                <button class="btn btn-primary px-5 fw-semibold" type="submit">Save</button>
            </form>
        </div>
    </div>
</th:block>
</html>
