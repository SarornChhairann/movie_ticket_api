<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Food Items', ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="bi bi-cup-straw me-2"></i>Food &amp; Drinks</h4>
        <a class="btn btn-primary px-4" th:href="@{/admin/food-items/new}">
            <i class="bi bi-plus-lg me-1"></i>New Item
        </a>
    </div>
    <div class="admin-table">
        <table class="table mb-0 align-middle">
            <thead>
            <tr>
                <th style="width:60px">Image</th>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Available</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${foodItems}">
                <td>
                    <div class="rounded-3 overflow-hidden d-flex align-items-center justify-content-center"
                         style="width:44px;height:44px;background:#f8fafc;border:1px solid #e2e8f0">
                        <img th:if="${item.imageUrl}" th:src="${item.imageUrl}" alt="" style="width:100%;height:100%;object-fit:cover">
                        <i th:unless="${item.imageUrl}" class="bi bi-image text-muted"></i>
                    </div>
                </td>
                <td class="fw-semibold" th:text="${item.name}"></td>
                <td class="text-muted" th:text="${item.description}"></td>
                <td th:text="'$' + ${item.price}"></td>
                <td>
                    <span th:if="${item.available}" class="badge bg-success">Yes</span>
                    <span th:unless="${item.available}" class="badge bg-secondary">No</span>
                </td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary me-1"
                       th:href="@{/admin/food-items/edit/{id}(id=${item.id})}">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a class="btn btn-sm btn-outline-danger"
                       th:href="@{/admin/food-items/delete/{id}(id=${item.id})}"
                       onclick="return confirm('Delete this item?')">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(foodItems)}">
                <td colspan="6" class="text-center text-muted py-4">No food items yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</html>
