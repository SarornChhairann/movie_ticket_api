<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Halls', ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="bi bi-building me-2"></i>Halls</h4>
        <a class="btn btn-primary px-4" th:href="@{/admin/halls/new}"><i class="bi bi-plus-lg me-1"></i>New Hall</a>
    </div>
    <div class="admin-table">
        <table class="table mb-0 align-middle">
            <thead>
            <tr><th>Name</th><th>Total Seats</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="hall : ${halls}">
                <td class="fw-semibold" th:text="${hall.name}"></td>
                <td><span class="badge bg-light text-dark border" th:text="${hall.totalSeats} + ' seats'"></span></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary me-1" th:href="@{/admin/halls/edit/{id}(id=${hall.id})}"><i class="bi bi-pencil"></i></a>
                    <a class="btn btn-sm btn-outline-danger" th:href="@{/admin/halls/delete/{id}(id=${hall.id})}"><i class="bi bi-trash"></i></a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(halls)}">
                <td colspan="3" class="text-center text-muted py-4">No halls yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</html>
