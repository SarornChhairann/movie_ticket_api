<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('User Detail', ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/admin/users}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
        <h4 class="fw-bold mb-0"><i class="bi bi-person-circle me-2"></i><span th:text="${user.name}"></span></h4>
        <span class="badge fs-6"
              th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-primary'"
              th:text="${user.role}"></span>
        <span class="badge fs-6"
              th:classappend="${user.status.name() == 'ACTIVE'} ? 'bg-success' :
                              (${user.status.name() == 'SUSPENDED'} ? 'bg-warning text-dark' : 'bg-dark')"
              th:text="${user.status}"></span>
    </div>

    <div class="row g-3 mb-4">
        <!-- Profile card -->
        <div class="col-md-4">
            <div class="admin-form-card card p-4">
                <h6 class="fw-bold mb-3 text-muted text-uppercase" style="font-size:.75rem;letter-spacing:.6px">Profile</h6>
                <table class="table table-sm mb-0">
                    <tr><th style="font-size:.82rem;width:100px">ID</th><td th:text="${user.id}"></td></tr>
                    <tr><th style="font-size:.82rem">Email</th><td th:text="${user.email}"></td></tr>
                    <tr><th style="font-size:.82rem">Phone</th><td th:text="${user.phone != null ? user.phone : '—'}"></td></tr>
                    <tr><th style="font-size:.82rem">Points</th>
                        <td><i class="bi bi-star-fill text-warning me-1"></i><span th:text="${user.points}"></span></td>
                    </tr>
                </table>
            </div>
        </div>

        <!-- Set status -->
        <div class="col-md-4">
            <div class="admin-form-card card p-4">
                <h6 class="fw-bold mb-3 text-muted text-uppercase" style="font-size:.75rem;letter-spacing:.6px">Set Status</h6>
                <form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post" class="d-flex gap-2">
                    <select name="status" class="form-select form-select-sm">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                th:selected="${s == user.status}"></option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-primary px-3">Save</button>
                </form>
            </div>
        </div>

        <!-- Adjust points -->
        <div class="col-md-4">
            <div class="admin-form-card card p-4">
                <h6 class="fw-bold mb-3 text-muted text-uppercase" style="font-size:.75rem;letter-spacing:.6px">Adjust Points</h6>
                <form th:action="@{/admin/users/{id}/points(id=${user.id})}" method="post" class="d-flex gap-2">
                    <input type="number" name="delta" class="form-control form-control-sm" placeholder="e.g. 50 or -20" style="max-width:160px">
                    <button type="submit" class="btn btn-sm btn-success px-3">Apply</button>
                </form>
                <small class="text-muted mt-1 d-block">Positive to add, negative to deduct.</small>
            </div>
        </div>
    </div>

    <!-- Booking history -->
    <h5 class="fw-bold mb-3">Booking History</h5>
    <div class="admin-table">
        <table class="table mb-0 align-middle">
            <thead>
            <tr>
                <th>#</th>
                <th>Movie</th>
                <th>Date</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Booked At</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${bookings}">
                <td class="text-muted" th:text="${b.id}"></td>
                <td th:text="${b.showtime.movie.title}"></td>
                <td th:text="${b.showtime.showDate}"></td>
                <td class="fw-semibold" th:text="'$' + ${b.totalAmount}"></td>
                <td><small th:text="${b.paymentMethod != null ? b.paymentMethod : '—'}"></small></td>
                <td>
                    <span class="badge"
                          th:classappend="${b.status.name() == 'CONFIRMED'} ? 'bg-success' :
                                          (${b.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-secondary')"
                          th:text="${b.status}"></span>
                </td>
                <td><small th:text="${#temporals.format(b.bookedAt, 'dd MMM yyyy HH:mm')}"></small></td>
            </tr>
            <tr th:if="${#lists.isEmpty(bookings)}">
                <td colspan="7" class="text-center text-muted py-4">No bookings yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</html>
