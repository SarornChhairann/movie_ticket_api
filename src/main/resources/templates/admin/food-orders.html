<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Food Orders', ~{::content})}">
<th:block th:fragment="content">
    <h4 class="fw-bold mb-4"><i class="bi bi-basket me-2"></i>Food Orders</h4>

    <!-- Date picker -->
    <form th:action="@{/admin/food-orders}" method="get" class="mb-3 d-flex gap-2 align-items-center">
        <label class="fw-semibold" style="font-size:.9rem">Date:</label>
        <input type="date" name="date" class="form-control form-control-sm" style="max-width:180px"
               th:value="${date}">
        <button class="btn btn-primary btn-sm px-3" type="submit">View</button>
        <a th:href="@{/admin/food-orders}" class="btn btn-outline-secondary btn-sm">Today</a>
    </form>

    <div class="admin-table">
        <table class="table mb-0 align-middle">
            <thead>
            <tr>
                <th>Booking #</th>
                <th>Customer</th>
                <th>Movie / Time</th>
                <th>Item</th>
                <th>Qty</th>
                <th>Unit Price</th>
                <th>Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td class="text-muted fw-semibold" th:text="${order.booking.id}"></td>
                <td>
                    <span th:if="${order.booking.user != null}" th:text="${order.booking.user.name}"></span>
                    <span th:if="${order.booking.user == null}" th:text="${order.booking.guestName != null ? order.booking.guestName : 'Guest'}"></span>
                </td>
                <td>
                    <span th:text="${order.booking.showtime.movie.title}"></span>
                    <small class="text-muted ms-1" th:text="${order.booking.showtime.showTime}"></small>
                </td>
                <td th:text="${order.foodItem.name}"></td>
                <td th:text="${order.quantity}"></td>
                <td th:text="'$' + ${order.unitPrice}"></td>
                <td class="fw-semibold"
                    th:text="'$' + ${#numbers.formatDecimal(order.unitPrice.multiply(new java.math.BigDecimal(order.quantity)),1,2)}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(orders)}">
                <td colspan="7" class="text-center text-muted py-4">No food orders for this date.</td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</html>
