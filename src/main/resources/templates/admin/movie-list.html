<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Movies', ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="bi bi-camera-video me-2"></i>Movies</h4>
        <a class="btn btn-primary px-4" th:href="@{/admin/movies/new}"><i class="bi bi-plus-lg me-1"></i>New Movie</a>
    </div>
    <div class="admin-table">
        <table class="table mb-0 align-middle">
            <thead>
            <tr>
                <th style="width:72px">Image</th>
                <th>Title</th>
                <th>Genre</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="movie : ${movies}">
                <td>
                    <img th:if="${movie.imagePath != null and !#strings.isEmpty(movie.imagePath)}"
                         th:src="${movie.imagePath}" alt="poster"
                         style="width:56px;height:56px;object-fit:cover;border-radius:6px;">
                    <div th:if="${movie.imagePath == null or #strings.isEmpty(movie.imagePath)}"
                         style="width:56px;height:56px;background:#e9ecef;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#adb5bd;font-size:1.2rem">
                        <i class="bi bi-image"></i>
                    </div>
                </td>
                <td class="fw-semibold" th:text="${movie.title}"></td>
                <td><span class="badge bg-light text-dark border" th:text="${movie.genre}"></span></td>
                <td>
                    <span class="badge"
                          th:classappend="${movie.status.name() == 'NOW_SHOWING'} ? 'bg-success' : (${movie.status.name() == 'COMING_SOON'} ? 'bg-warning text-dark' : 'bg-secondary')"
                          th:text="${movie.status}"></span>
                </td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary me-1" th:href="@{/admin/movies/edit/{id}(id=${movie.id})}"><i class="bi bi-pencil"></i></a>
                    <a class="btn btn-sm btn-outline-danger" th:href="@{/admin/movies/delete/{id}(id=${movie.id})}"><i class="bi bi-trash"></i></a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(movies)}">
                <td colspan="5" class="text-center text-muted py-4">No movies yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</html>
