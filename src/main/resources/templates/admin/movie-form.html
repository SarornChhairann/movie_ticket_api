<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Movie Form', ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex align-items-center gap-2 mb-4">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/movies}"><i class="bi bi-arrow-left"></i></a>
        <h4 class="fw-bold mb-0" th:text="${movie.id == null} ? 'New Movie' : 'Edit Movie'">Movie</h4>
    </div>

    <div class="admin-form-card card p-4" style="max-width:680px">
        <div th:if="${uploadError}" class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i><span th:text="${uploadError}"></span></div>
        <form th:action="@{/admin/movies/save}" th:object="${movie}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{imagePath}">

            <div class="mb-3">
                <label class="form-label fw-semibold">Title</label>
                <input class="form-control" th:field="*{title}" placeholder="Movie title" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Description</label>
                <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Brief synopsis..."></textarea>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Genre</label>
                    <input class="form-control" th:field="*{genre}" placeholder="e.g. Action, Drama" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Duration (minutes)</label>
                    <input class="form-control" type="number" th:field="*{durationMinutes}" min="1" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Status</label>
                <select class="form-select" th:field="*{status}">
                    <option th:each="s : ${T(co.tkm.ticketmanagementsystem.enums.MovieStatus).values()}"
                            th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Poster Image</label>
                <input class="form-control" type="file" name="imageFile" accept="image/*">
                <div class="form-text">Leave empty to keep the current image.</div>
            </div>
            <div class="mb-4" th:if="${movie.imagePath != null and !#strings.isEmpty(movie.imagePath)}">
                <label class="form-label fw-semibold">Current Poster</label><br>
                <img th:src="${movie.imagePath}" alt="Current poster"
                     style="max-width:160px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)">
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary px-4" type="submit"><i class="bi bi-save me-1"></i>Save</button>
                <a class="btn btn-outline-secondary px-4" th:href="@{/admin/movies}">Cancel</a>
            </div>
        </form>
    </div>
</th:block>
</html>
