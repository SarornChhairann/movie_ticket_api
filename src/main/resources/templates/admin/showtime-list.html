<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Showtimes', ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="bi bi-calendar3 me-2"></i>Showtimes</h4>
        <a class="btn btn-primary px-4" th:href="@{/admin/showtimes/new}"><i class="bi bi-plus-lg me-1"></i>New Showtime</a>
    </div>
    <div class="admin-table">
        <table class="table mb-0 align-middle">
            <thead>
            <tr><th>Movie</th><th>Hall</th><th>Date</th><th>Time</th><th>Normal $</th><th>Couple $</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="showtime : ${showtimes}">
                <td class="fw-semibold" th:text="${showtime.movie.title}"></td>
                <td th:text="${showtime.hall.name}"></td>
                <td th:text="${showtime.showDate}"></td>
                <td th:text="${showtime.showTime}"></td>
                <td th:text="${showtime.normalPrice}"></td>
                <td th:text="${showtime.couplePrice}"></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-danger" th:href="@{/admin/showtimes/delete/{id}(id=${showtime.id})}"><i class="bi bi-trash"></i></a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(showtimes)}">
                <td colspan="7" class="text-center text-muted py-4">No showtimes yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</html>
