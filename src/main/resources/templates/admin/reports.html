<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Reports', ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h4 class="fw-bold mb-0"><i class="bi bi-bar-chart-line me-2"></i>Reports</h4>
        <a class="btn btn-outline-success" th:href="@{/admin/reports/export}">
            <i class="bi bi-download me-1"></i>Export All CSV
        </a>
    </div>

    <!-- Revenue summary cards -->
    <div class="row g-3 mb-4">
        <div class="col-sm-4">
            <div class="admin-stat-card card p-3">
                <div class="text-muted mb-1" style="font-size:.8rem;text-transform:uppercase;letter-spacing:.6px">Revenue Today</div>
                <div class="fw-bold fs-3 text-success" th:text="'$' + ${#numbers.formatDecimal(revenueToday,1,2)}">$0.00</div>
            </div>
        </div>
        <div class="col-sm-4">
            <div class="admin-stat-card card p-3">
                <div class="text-muted mb-1" style="font-size:.8rem;text-transform:uppercase;letter-spacing:.6px">Revenue This Week</div>
                <div class="fw-bold fs-3 text-primary" th:text="'$' + ${#numbers.formatDecimal(revenueWeek,1,2)}">$0.00</div>
            </div>
        </div>
        <div class="col-sm-4">
            <div class="admin-stat-card card p-3">
                <div class="text-muted mb-1" style="font-size:.8rem;text-transform:uppercase;letter-spacing:.6px">Revenue This Month</div>
                <div class="fw-bold fs-3 text-warning" th:text="'$' + ${#numbers.formatDecimal(revenueMonth,1,2)}">$0.00</div>
            </div>
        </div>
    </div>

    <!-- Revenue chart -->
    <div class="admin-stat-card card p-3 mb-4">
        <div class="fw-semibold mb-3" style="font-size:.9rem">Daily Revenue — Last 30 Days</div>
        <canvas id="revenueChart" height="80"></canvas>
    </div>

    <!-- Top movies -->
    <div class="admin-stat-card card p-0 mb-4">
        <div class="px-3 pt-3 pb-2 fw-semibold" style="font-size:.9rem">Top 10 Movies by Revenue</div>
        <table class="table table-sm mb-0 align-middle">
            <thead><tr>
                <th class="ps-3" style="font-size:.75rem">Movie</th>
                <th style="font-size:.75rem">Tickets Sold</th>
                <th style="font-size:.75rem">Total Revenue</th>
            </tr></thead>
            <tbody>
            <tr th:each="m : ${topMovies}">
                <td class="ps-3" th:text="${m.title}"></td>
                <td th:text="${m.tickets}"></td>
                <td class="fw-semibold" th:text="'$' + ${m.revenue}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(topMovies)}">
                <td colspan="3" class="text-center text-muted py-3">No confirmed bookings yet.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script th:inline="javascript">
        const labels   = /*[[${chartLabels}]]*/ "[]";
        const revenues = /*[[${chartRevenues}]]*/ "[]";

        new Chart(document.getElementById('revenueChart'), {
            type: 'bar',
            data: {
                labels: JSON.parse(labels),
                datasets: [{
                    label: 'Revenue ($)',
                    data: JSON.parse(revenues),
                    backgroundColor: 'rgba(99,102,241,.7)',
                    borderRadius: 4
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                    y: { beginAtZero: true, ticks: { font: { size: 10 } } }
                }
            }
        });
    </script>
</th:block>
</html>
