<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Users', ~{::content})}">
<th:block th:fragment="content">
    <h4 class="fw-bold mb-4"><i class="bi bi-people me-2"></i>Users</h4>
    <div class="admin-table">
        <table class="table mb-0 align-middle">
            <thead>
            <tr><th>#</th><th>Name</th><th>Email</th><th>Role</th></tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td class="text-muted" th:text="${user.id}"></td>
                <td class="fw-semibold" th:text="${user.name}"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-primary'"
                          th:text="${user.role}"></span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="4" class="text-center text-muted py-4">No users yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</html>
