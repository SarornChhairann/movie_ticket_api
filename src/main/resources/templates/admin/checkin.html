<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Check-in', ~{::content})}">
<th:block th:fragment="content">
    <h4 class="fw-bold mb-4"><i class="bi bi-qr-code-scan me-2"></i>Cinema Check-in</h4>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h6 class="fw-bold mb-3">Scan or Enter Ticket Code</h6>
                    <form th:action="@{/admin/checkin}" method="post">
                        <div class="mb-3">
                            <input class="form-control form-control-lg" type="text" name="ticketCode"
                                   id="ticketCodeInput"
                                   placeholder="Ticket code or scan QR..."
                                   th:value="${failedCode}" autofocus autocomplete="off">
                        </div>
                        <button class="btn btn-primary w-100 fw-bold py-2" type="submit">
                            <i class="bi bi-check2-circle me-2"></i>Verify &amp; Check In
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <!-- Success result -->
            <div th:if="${success}" class="card border-0 shadow-sm rounded-4 border-success"
                 style="border-left: 4px solid #22c55e !important">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div style="width:48px;height:48px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                            <i class="bi bi-check-lg text-success" style="font-size:1.5rem"></i>
                        </div>
                        <div>
                            <div class="fw-bold text-success fs-5">Check-in Successful!</div>
                            <div class="text-muted" style="font-size:.85rem">
                                Scanned at <span th:text="${#temporals.format(ticket.scannedAt, 'HH:mm dd MMM yyyy')}"></span>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="row g-2" style="font-size:.9rem">
                        <div class="col-6">
                            <div class="text-muted" style="font-size:.72rem;text-transform:uppercase">Movie</div>
                            <div class="fw-semibold" th:text="${ticket.booking.showtime.movie.title}"></div>
                        </div>
                        <div class="col-6">
                            <div class="text-muted" style="font-size:.72rem;text-transform:uppercase">Seat</div>
                            <div class="fw-semibold" th:text="${ticket.seat.seatCode}"></div>
                        </div>
                        <div class="col-6">
                            <div class="text-muted" style="font-size:.72rem;text-transform:uppercase">Hall</div>
                            <div class="fw-semibold" th:text="${ticket.booking.showtime.hall.name}"></div>
                        </div>
                        <div class="col-6">
                            <div class="text-muted" style="font-size:.72rem;text-transform:uppercase">Showtime</div>
                            <div class="fw-semibold">
                                <span th:text="${ticket.booking.showtime.showDate}"></span>
                                <span th:text="${ticket.booking.showtime.showTime}"></span>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="text-muted" style="font-size:.72rem;text-transform:uppercase">Customer</div>
                            <div class="fw-semibold"
                                 th:text="${ticket.booking.user != null} ? ${ticket.booking.user.name} : (${ticket.booking.guestName != null} ? ${ticket.booking.guestName} : 'Guest')"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Error result -->
            <div th:if="${error}" class="card border-0 shadow-sm rounded-4"
                 style="border-left: 4px solid #ef4444 !important">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center gap-3">
                        <div style="width:48px;height:48px;background:#fee2e2;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                            <i class="bi bi-x-lg text-danger" style="font-size:1.5rem"></i>
                        </div>
                        <div>
                            <div class="fw-bold text-danger fs-5">Check-in Failed</div>
                            <div class="text-muted" style="font-size:.9rem" th:text="${error}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auto-focus ticket code input
        document.getElementById('ticketCodeInput').focus();
    </script>
</th:block>
</html>
