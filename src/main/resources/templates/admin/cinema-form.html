<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Cinema Form', ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex align-items-center gap-2 mb-4">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/cinemas}"><i class="bi bi-arrow-left"></i></a>
        <h4 class="fw-bold mb-0" th:text="${cinema.id == null} ? 'New Cinema' : 'Edit Cinema'">Cinema</h4>
    </div>

    <div class="admin-form-card card p-4" style="max-width:560px">
        <div th:if="${error}" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        </div>
        <form th:action="@{/admin/cinemas/save}" th:object="${cinema}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label fw-semibold">Cinema Name</label>
                <input class="form-control" th:field="*{name}" placeholder="Legend Noro Lane" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Address</label>
                <input class="form-control" th:field="*{address}" placeholder="3rd Floor, Noro Lane">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Opening Hours</label>
                <input class="form-control" th:field="*{openingHours}" placeholder="09:30 - 22:30">
            </div>

            <div class="row g-2">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Total Halls</label>
                        <input class="form-control" type="number" min="0" th:field="*{totalHalls}" placeholder="3">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Latitude</label>
                        <input class="form-control" type="number" step="0.000001" th:field="*{latitude}" placeholder="11.556">
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Longitude</label>
                <input class="form-control" type="number" step="0.000001" th:field="*{longitude}" placeholder="104.928">
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-primary px-4" type="submit"><i class="bi bi-save me-1"></i>Save</button>
                <a class="btn btn-outline-secondary px-4" th:href="@{/admin/cinemas}">Cancel</a>
            </div>
        </form>
    </div>
</th:block>
</html>
