<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-base :: layout('Bookings', ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h4 class="fw-bold mb-0"><i class="bi bi-receipt me-2"></i>Bookings</h4>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-success btn-sm" th:href="@{/admin/bookings/export(q=${q})}">
                <i class="bi bi-download me-1"></i>Export CSV
            </a>
        </div>
    </div>

    <!-- Search bar -->
    <form th:action="@{/admin/bookings}" method="get" class="mb-3 d-flex gap-2">
        <input type="text" name="q" class="form-control" placeholder="Search by ID, customer, email, movie…"
               th:value="${q}" style="max-width:380px">
        <button class="btn btn-primary px-4" type="submit"><i class="bi bi-search me-1"></i>Search</button>
        <a th:href="@{/admin/bookings}" class="btn btn-outline-secondary" th:if="${q != null and !#strings.isEmpty(q)}">Clear</a>
    </form>

    <div class="admin-table">
        <table class="table mb-0 align-middle">
            <thead>
            <tr>
                <th>#</th>
                <th>Customer</th>
                <th>Movie</th>
                <th>Date / Time</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Booked At</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="booking : ${bookings}">
                <td class="fw-semibold text-muted" th:text="${booking.id}"></td>
                <td>
                    <span th:if="${booking.user != null}">
                        <a th:href="@{/admin/users/{id}(id=${booking.user.id})}" class="text-decoration-none fw-semibold"
                           th:text="${booking.user.name}"></a>
                        <br><small class="text-muted" th:text="${booking.user.email}"></small>
                    </span>
                    <span th:if="${booking.user == null}">
                        <i class="bi bi-person-dash text-muted me-1"></i>
                        <span th:text="${booking.guestName != null ? booking.guestName : 'Guest'}"></span>
                        <br><small class="text-muted" th:text="${booking.guestEmail}"></small>
                    </span>
                </td>
                <td th:text="${booking.showtime.movie.title}"></td>
                <td>
                    <span th:text="${booking.showtime.showDate}"></span>
                    <small class="text-muted ms-1" th:text="${booking.showtime.showTime}"></small>
                </td>
                <td class="fw-semibold" th:text="'$' + ${booking.totalAmount}"></td>
                <td><small th:text="${booking.paymentMethod != null ? booking.paymentMethod : '—'}"></small></td>
                <td>
                    <span class="badge"
                          th:classappend="${booking.status.name() == 'CONFIRMED'} ? 'bg-success' :
                                          (${booking.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-secondary')"
                          th:text="${booking.status}"></span>
                </td>
                <td><small th:text="${#temporals.format(booking.bookedAt, 'dd MMM yyyy HH:mm')}"></small></td>
                <td class="text-end">
                    <form th:if="${booking.status.name() != 'CANCELLED'}"
                          th:action="@{/admin/bookings/{id}/cancel(id=${booking.id})}"
                          method="post" class="d-inline"
                          th:attr="data-confirm=${'Cancel booking #' + booking.id + '?'},data-confirm-title='Cancel booking',data-confirm-ok='Cancel booking',data-confirm-cancel='Keep booking',data-confirm-danger='true'">
                        <button class="btn btn-sm btn-outline-danger" type="submit">
                            <i class="bi bi-x-circle"></i>
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(bookings)}">
                <td colspan="9" class="text-center text-muted py-4">No bookings found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</html>
