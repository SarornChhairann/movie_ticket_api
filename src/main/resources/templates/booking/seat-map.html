<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Select Seats', ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex align-items-start justify-content-between flex-wrap gap-2 mb-1">
        <h4 class="fw-bold mb-0"><i class="bi bi-grid-3x3-gap me-2" style="color:var(--mtms-accent)"></i>Select Your Seats</h4>
        <div class="d-flex align-items-center gap-1 text-muted" style="font-size:.82rem">
            <i class="bi bi-hourglass-split"></i>
            <span>Seats held for <strong th:text="${holdMinutes}">10</strong> min after selection</span>
        </div>
    </div>
    <p class="text-muted mb-4" style="font-size:.9rem">Click to select one or more seats, then continue to checkout.</p>

    <form th:action="@{/bookings/checkout/{id}(id=${showtimeId})}" method="get">
        <!-- Seat grid -->
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-3">
            <div class="seat-grid mb-3" id="seatGrid">
                <div class="seat-item" th:each="showtimeSeat : ${showtimeSeats}">
                    <label class="seat-label"
                           th:classappend="${showtimeSeat.status.name() == 'BOOKED' or heldByOthers.contains(showtimeSeat.id)} ? ' seat-booked' : (${showtimeSeat.seat.seatType.name() == 'COUPLE'} ? ' seat-couple' : ' seat-normal')">
                        <input type="checkbox"
                               name="seatIds"
                               th:value="${showtimeSeat.id}"
                               th:disabled="${showtimeSeat.status.name() == 'BOOKED' or heldByOthers.contains(showtimeSeat.id)}"
                               th:attr="data-seat-code=${showtimeSeat.seat.seatCode},data-seat-type=${showtimeSeat.seat.seatType.name()}"
                               class="d-none seat-checkbox">
                        <span th:text="${showtimeSeat.seat.seatCode}"></span>
                    </label>
                </div>
            </div>
            <div class="screen-indicator">▲ &nbsp; SCREEN &nbsp; ▲</div>
        </div>

        <!-- Legend + count -->
        <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
            <span class="d-flex align-items-center gap-1 text-muted" style="font-size:.85rem">
                <span style="width:18px;height:18px;background:rgba(42,167,255,.14);border:1px solid rgba(42,167,255,.25);border-radius:4px;display:inline-block"></span> Normal
            </span>
            <span class="d-flex align-items-center gap-1 text-muted" style="font-size:.85rem">
                <span style="width:36px;height:18px;background:rgba(214,178,94,.16);border:1px solid rgba(214,178,94,.30);border-radius:4px;display:inline-block"></span> Couple
            </span>
            <span class="d-flex align-items-center gap-1 text-muted" style="font-size:.85rem">
                <span style="width:18px;height:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.07);border-radius:4px;display:inline-block"></span> Booked
            </span>
            <span class="d-flex align-items-center gap-1 text-muted" style="font-size:.85rem">
                <span style="width:18px;height:18px;background:rgba(214,178,94,.24);border-radius:4px;outline:2px solid var(--mtms-accent);display:inline-block"></span> Selected
            </span>
            <span class="ms-auto fw-semibold" id="selectedCount" style="font-size:.92rem;color:var(--mtms-text)">0 seat(s) selected</span>
        </div>

        <button class="btn btn-primary px-5 fw-semibold" type="submit">
            <i class="bi bi-arrow-right-circle me-1"></i>Continue to Checkout
        </button>
    </form>

    <script>
        const seatCheckboxes = Array.from(document.querySelectorAll('.seat-checkbox'));

        seatCheckboxes.forEach(function (checkbox) {
            if (checkbox.dataset.seatType !== 'COUPLE') return;
            const seatItem = checkbox.closest('.seat-item');
            if (seatItem) seatItem.classList.add('seat-couple-unit');
        });

        function updateCount() {
            const n = seatCheckboxes.filter(c => c.checked).length;
            document.getElementById('selectedCount').textContent = n + ' seat(s) selected';
        }

        seatCheckboxes.forEach(function (checkbox) {
            checkbox.addEventListener('change', function () {
                checkbox.closest('label').classList.toggle('seat-selected', checkbox.checked);
                updateCount();
            });
        });
    </script>
</th:block>
</html>
