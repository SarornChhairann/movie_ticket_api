<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('My Bookings', ~{::content})}">
<th:block th:fragment="content">
    <h4 class="fw-bold mb-4"><i class="bi bi-ticket-perforated me-2"></i>My Bookings</h4>

    <div th:if="${#lists.isEmpty(bookings)}" class="text-center py-5 text-muted">
        <i class="bi bi-receipt" style="font-size:3rem"></i>
        <p class="mt-3 fs-5">You haven't made any bookings yet.</p>
        <a class="btn btn-primary px-4" th:href="@{/movies}">Browse Movies</a>
    </div>

    <div th:if="${!#lists.isEmpty(bookings)}" class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <table class="table mb-0 align-middle">
            <thead style="background:#f8fafc">
            <tr>
                <th style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#64748b">#</th>
                <th style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#64748b">Movie</th>
                <th style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#64748b">Showtime</th>
                <th style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#64748b">Total</th>
                <th style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#64748b">Status</th>
                <th style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#64748b">Ticket</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="booking : ${bookings}">
                <td class="text-muted" th:text="'#' + ${booking.id}"></td>
                <td class="fw-semibold" th:text="${booking.showtime.movie.title}"></td>
                <td>
                    <span th:text="${booking.showtime.showDate}"></span>
                    <span class="text-muted ms-1" th:text="${booking.showtime.showTime}"></span>
                </td>
                <td class="fw-semibold" th:text="'$' + ${booking.totalAmount}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${booking.status.name() == 'CONFIRMED'} ? 'bg-success' : (${booking.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-secondary')"
                          th:text="${booking.status}"></span>
                </td>
                <td>
                    <a th:if="${firstTicketByBooking[booking.id] != null}"
                       class="btn btn-sm btn-outline-primary px-3"
                       th:href="@{/tickets/{code}(code=${firstTicketByBooking[booking.id]})}">
                        <i class="bi bi-eye me-1"></i>View
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</html>
