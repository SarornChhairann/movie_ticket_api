<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('My Bookings', ~{::content})}">
<th:block th:fragment="content">
    <h4 class="fw-bold mb-4"><i class="bi bi-ticket-perforated me-2"></i>My Bookings</h4>

    <div th:if="${#lists.isEmpty(bookings)}" class="text-center py-5 text-muted">
        <i class="bi bi-receipt" style="font-size:3rem"></i>
        <p class="mt-3 fs-5">You haven't made any bookings yet.</p>
        <a class="btn btn-primary px-4" th:href="@{/movies}">Browse Movies</a>
    </div>

    <div th:if="${!#lists.isEmpty(bookings)}" class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <table class="table mb-0 align-middle">
            <thead>
            <tr>
                <th style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px">#</th>
                <th style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px">Movie</th>
                <th style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px">Showtime</th>
                <th style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px">Total</th>
                <th style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px">Status</th>
                <th style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px">Ticket</th>
                <th style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px"></th>
                <th style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="booking : ${bookings}">
                <td class="fw-semibold" style="color:var(--mtms-accent);font-size:.85rem;letter-spacing:.3px"
                    th:text="${T(String).format('BK-%05d', booking.id)}"></td>
                <td class="fw-semibold" th:text="${booking.showtime.movie.title}"></td>
                <td>
                    <span th:text="${booking.showtime.showDate}"></span>
                    <span class="text-muted ms-1" th:text="${booking.showtime.showTime}"></span>
                </td>
                <td class="fw-semibold" th:text="'$' + ${booking.totalAmount}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${booking.status.name() == 'CONFIRMED'} ? 'bg-success' : (${booking.status.name() == 'PENDING'} ? 'bg-warning' : 'bg-secondary')"
                          th:text="${booking.status}"></span>
                </td>
                <td>
                    <a th:if="${firstTicketByBooking[booking.id] != null}"
                       class="btn btn-sm btn-outline-primary px-3"
                       th:href="@{/tickets/{code}(code=${firstTicketByBooking[booking.id]})}">
                        <i class="bi bi-eye me-1"></i>View
                    </a>
                </td>
                <td>
                    <form th:if="${booking.status.name() != 'CANCELLED'}"
                          th:action="@{/bookings/cancel/{id}(id=${booking.id})}" method="post"
                          th:attr="data-confirm=${'Cancel ' + T(String).format('BK-%05d', booking.id) + '? This cannot be undone.'},data-confirm-title='Cancel booking',data-confirm-ok='Cancel booking',data-confirm-cancel='Keep booking',data-confirm-danger='true'">
                        <button class="btn btn-sm btn-outline-danger px-3" type="submit">
                            <i class="bi bi-x-circle me-1"></i>Cancel
                        </button>
                    </form>
                    <!-- Cancellation window hint -->
                    <small th:if="${booking.status.name() == 'CONFIRMED'}"
                           class="d-block text-muted mt-1" style="font-size:.72rem">
                        Cancel &gt;2h before show
                    </small>
                </td>
                <td>
                    <a class="btn btn-sm btn-outline-secondary px-3"
                       th:href="@{/movies/{id}(id=${booking.showtime.movie.id})}">
                        <i class="bi bi-arrow-repeat me-1"></i>Book Again
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</html>
