<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Checkout', ~{::content})}">
<th:block th:fragment="content">
    <h4 class="fw-bold mb-4"><i class="bi bi-bag-check me-2"></i>Checkout</h4>

    <div class="row g-4">
        <!-- Order summary -->
        <div class="col-md-5">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-body p-4">
                    <h6 class="fw-bold mb-3 text-muted" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.8px">Order Summary</h6>
                    <p class="mb-2 fw-semibold" th:text="${checkoutData.showtime.movie.title}"></p>
                    <p class="mb-1 text-muted" style="font-size:.9rem">
                        <i class="bi bi-building me-1"></i>
                        <span th:text="${checkoutData.showtime.hall.name}"></span>
                    </p>
                    <p class="mb-3 text-muted" style="font-size:.9rem">
                        <i class="bi bi-calendar-event me-1"></i>
                        <span th:text="${checkoutData.showtime.showDate}"></span> &nbsp;
                        <span th:text="${checkoutData.showtime.showTime}"></span>
                    </p>
                    <hr>
                    <div class="mb-2" style="font-size:.9rem">
                        <strong>Seats:</strong>
                        <span th:each="seat, stat : ${checkoutData.selectedSeats}">
                            <span class="badge bg-light text-dark border ms-1" th:text="${seat.seat.seatCode}"></span>
                        </span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                        <span class="fw-bold">Total</span>
                        <span class="fw-bold fs-5 text-success" th:text="'$' + ${checkoutData.totalAmount}"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Payment + optional guest form -->
        <div class="col-md-7">
            <form th:action="@{/bookings/checkout/{id}(id=${checkoutData.showtime.id})}" method="post">
                <div th:each="seatId : ${seatIds}">
                    <input type="hidden" name="seatIds" th:value="${seatId}">
                </div>

                <!-- Guest info — shown only when NOT authenticated -->
                <div th:if="${!isAuthenticated}" class="card border-0 shadow-sm rounded-4 mb-3">
                    <div class="card-body p-4">
                        <h6 class="fw-bold mb-3">
                            <i class="bi bi-person me-2"></i>Your Details
                        </h6>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="font-size:.88rem">Full Name</label>
                            <input class="form-control" type="text" name="guestName" placeholder="Your name" required>
                        </div>
                        <div class="mb-1">
                            <label class="form-label fw-semibold" style="font-size:.88rem">Contact Phone</label>
                            <input class="form-control" type="tel" name="guestPhone" placeholder="+855 12 345 678" required>
                        </div>
                    </div>
                </div>

                <!-- Mock payment -->
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body p-4">
                        <h6 class="fw-bold mb-3"><i class="bi bi-credit-card me-2"></i>Payment</h6>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="font-size:.88rem">Card Number</label>
                            <input class="form-control" value="4111 1111 1111 1111" readonly style="background:#f8fafc;color:#64748b">
                        </div>
                        <div class="row g-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold" style="font-size:.88rem">Expiry</label>
                                <input class="form-control" value="12/30" readonly style="background:#f8fafc;color:#64748b">
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold" style="font-size:.88rem">CVV</label>
                                <input class="form-control" value="123" readonly style="background:#f8fafc;color:#64748b">
                            </div>
                        </div>
                    </div>
                </div>

                <button class="btn btn-success w-100 fw-bold py-3 rounded-3" type="submit" style="font-size:1rem">
                    <i class="bi bi-lock-fill me-2"></i>Confirm &amp; Pay $<span th:text="${checkoutData.totalAmount}"></span>
                </button>
                <p class="text-center text-muted mt-2" style="font-size:.78rem">
                    <i class="bi bi-shield-check me-1"></i>Secure mock payment — no real charges
                </p>
            </form>
        </div>
    </div>
</th:block>
</html>
