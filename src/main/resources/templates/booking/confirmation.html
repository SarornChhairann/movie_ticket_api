<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Booking Confirmed', ~{::content})}">
<th:block th:fragment="content">
    <!-- Success banner -->
    <div class="text-center mb-4">
        <div style="width:64px;height:64px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.28);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto .75rem">
            <i class="bi bi-check-lg" style="font-size:1.8rem;color:#86efac"></i>
        </div>
        <h3 class="fw-bold">Booking Confirmed!</h3>
        <p class="text-muted">Your tickets are ready. Download or save your ticket codes below.</p>
    </div>

    <!-- Summary card -->
    <div class="card border-0 shadow-sm rounded-4 mb-4" style="max-width:560px;margin:0 auto">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span style="font-size:.8rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mtms-muted)">Booking Reference</span>
                <span class="fw-bold" th:text="'#' + ${booking.id}"></span>
            </div>
            <hr class="my-2">
            <p class="mb-1"><strong>Movie:</strong> <span th:text="${booking.showtime.movie.title}"></span></p>
            <p class="mb-1"><strong>Date &amp; Time:</strong>
                <span th:text="${booking.showtime.showDate}"></span> &nbsp;
                <span th:text="${booking.showtime.showTime}"></span>
            </p>
            <p class="mb-1"><strong>Hall:</strong> <span th:text="${booking.showtime.hall.name}"></span></p>
            <!-- Price breakdown -->
            <hr class="my-2">
            <div style="font-size:.85rem">
                <div th:if="${booking.serviceFee != null}" class="d-flex justify-content-between text-muted mb-1">
                    <span>Service fee</span><span th:text="'$' + ${booking.serviceFee}"></span>
                </div>
                <div th:if="${booking.taxAmount != null}" class="d-flex justify-content-between text-muted mb-1">
                    <span>Tax</span><span th:text="'$' + ${booking.taxAmount}"></span>
                </div>
                <div th:if="${booking.discountAmount != null and booking.discountAmount.compareTo(T(java.math.BigDecimal).ZERO) > 0}"
                     class="d-flex justify-content-between mb-1" style="color:#86efac">
                    <span><i class="bi bi-tag me-1"></i>Promo (<span th:text="${booking.promoCode}"></span>)</span>
                    <span th:text="'-$' + ${booking.discountAmount}"></span>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-2 pt-2" style="border-top:1px solid rgba(255,255,255,.10)">
                <span class="fw-bold">Total Paid</span>
                <span class="fw-bold" style="color:#86efac" th:text="'$' + ${booking.totalAmount}"></span>
            </div>
            <p class="mb-0 mt-2"><strong>Status:</strong>
                <span class="badge bg-success" th:text="${booking.status}"></span>
            </p>
            <p th:if="${booking.paymentMethod != null}" class="mb-0 mt-1 text-muted" style="font-size:.82rem">
                <i class="bi bi-credit-card me-1"></i>Paid via <span th:text="${booking.paymentMethod}"></span>
            </p>
        </div>
    </div>

    <!-- Tickets -->
    <h6 class="fw-bold mb-3 text-center" style="max-width:560px;margin:0 auto 1rem">Your Tickets</h6>
    <div style="max-width:560px;margin:0 auto">
        <div th:each="ticket : ${tickets}" class="card border-0 shadow-sm rounded-3 mb-3 p-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <span><i class="bi bi-ticket-perforated me-2" style="color:var(--mtms-accent)"></i>
                    Seat <strong th:text="${ticket.seat.seatCode}"></strong></span>
                <a class="btn btn-outline-primary btn-sm px-3 fw-semibold"
                   th:href="@{/tickets/{code}(code=${ticket.ticketCode})}"
                   th:text="${ticket.ticketCode}"></a>
            </div>
            <div class="text-center mb-3">
                <img th:src="@{/tickets/{code}/qr(code=${ticket.ticketCode})}"
                     alt="QR Code" width="160" height="160"
                     style="border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px;background:#fff">
            </div>
            <div class="text-center">
                <a class="btn btn-dark btn-sm px-4 fw-semibold"
                   th:href="@{/tickets/{code}/pdf(code=${ticket.ticketCode})}">
                    <i class="bi bi-file-earmark-pdf me-1"></i>Download PDF
                </a>
            </div>
        </div>
    </div>

    <div class="text-center mt-4 d-flex flex-wrap justify-content-center gap-3">
        <a class="btn btn-primary px-5" th:href="@{/movies}">
            <i class="bi bi-house me-1"></i>Back to Movies
        </a>
        <a class="btn btn-outline-secondary px-5"
           th:href="@{/movies/{id}(id=${booking.showtime.movie.id})}">
            <i class="bi bi-arrow-repeat me-1"></i>Book Again
        </a>
    </div>
</th:block>
</html>
