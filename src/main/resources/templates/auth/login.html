<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Login', ~{::content})}">
<th:block th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <div style="width:56px;height:56px;background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto .75rem">
                    <i class="bi bi-film text-white" style="font-size:1.5rem"></i>
                </div>
                <h4 class="fw-bold mb-0">Welcome back</h4>
                <p class="text-muted" style="font-size:.9rem">Sign in to your account</p>
            </div>
            <div class="auth-card card shadow-sm">
                <div class="card-body p-4">
                    <div th:if="${param.logout}" class="alert alert-info py-2" style="font-size:.88rem">
                        <i class="bi bi-info-circle me-1"></i>You have been signed out.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success py-2" style="font-size:.88rem">
                        <i class="bi bi-check-circle me-1"></i>Registration successful. Please sign in.
                    </div>
                    <div th:if="${param.error}" class="alert alert-danger py-2" style="font-size:.88rem">
                        <i class="bi bi-exclamation-triangle me-1"></i>Invalid email or password.
                    </div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="font-size:.88rem">Email</label>
                            <input class="form-control" type="email" name="username" placeholder="you@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold" style="font-size:.88rem">Password</label>
                            <input class="form-control" type="password" name="password" placeholder="••••••••" required>
                        </div>
                        <button class="btn btn-primary w-100 fw-semibold" type="submit">Sign In</button>
                    </form>
                    <p class="text-center mt-3 mb-0" style="font-size:.88rem">
                        Don't have an account?
                        <a class="fw-semibold text-decoration-none" th:href="@{/register}">Register</a>
                    </p>
                </div>
            </div>
            <p class="text-center mt-3 text-muted" style="font-size:.82rem">
                <i class="bi bi-arrow-left me-1"></i>
                <a th:href="@{/movies}" class="text-muted">Continue without account</a>
            </p>
        </div>
    </div>
</th:block>
</html>
