<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Register', ~{::content})}">
<th:block th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <div style="width:56px;height:56px;background:linear-gradient(135deg,var(--mtms-surface),var(--mtms-card));border:1px solid rgba(214,178,94,.22);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto .75rem">
                    <i class="bi bi-person-plus" style="font-size:1.5rem;color:var(--mtms-accent)"></i>
                </div>
                <h4 class="fw-bold mb-0">Create account</h4>
                <p class="text-muted" style="font-size:.9rem">Save your bookings and history</p>
            </div>
            <div class="auth-card card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/register}" th:object="${registerForm}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="font-size:.88rem">Full Name</label>
                            <input class="form-control" th:field="*{name}" placeholder="Your name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="font-size:.88rem">Email</label>
                            <input class="form-control" type="email" th:field="*{email}" placeholder="you@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold" style="font-size:.88rem">Password</label>
                            <input class="form-control" type="password" th:field="*{password}" placeholder="Min. 6 characters" required>
                        </div>
                        <button class="btn btn-primary w-100 fw-semibold" type="submit">
                            <i class="bi bi-person-check me-1"></i>Register
                        </button>
                    </form>
                    <p class="text-center mt-3 mb-0" style="font-size:.88rem">
                        Already have an account?
                        <a class="fw-semibold text-decoration-none" th:href="@{/login}">Sign in</a>
                    </p>
                </div>
            </div>
            <p class="text-center mt-3 text-muted" style="font-size:.82rem">
                <i class="bi bi-arrow-left me-1"></i>
                <a th:href="@{/movies}" class="text-muted">Continue without account</a>
            </p>
        </div>
    </div>
</th:block>
</html>
