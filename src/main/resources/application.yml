server:
  port: ${SERVER_PORT:8010}
  error:
    # Spring Boot DevTools turns these on for local runs; keep stack traces,
    # exception names, and raw exception messages (which can carry SQL) out of
    # error responses everywhere. ApiExceptionHandler writes its own messages.
    include-stacktrace: ${SERVER_ERROR_INCLUDE_STACKTRACE:never}
    include-exception: ${SERVER_ERROR_INCLUDE_EXCEPTION:false}
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}

spring:
  application:
    name: TicketManagementSystem

  config:
    # Every value below comes from .env in the project root. "optional:" so the app
    # still starts without it (the defaults after each ":" are the same values), and
    # real environment variables still win over the file - which is how the container
    # in docker-compose.yml overrides the localhost addresses with db:/keycloak:.
    import: optional:file:./.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:spring_boot_ticket}
    username: ${POSTGRES_USER:myuser}
    password: ${POSTGRES_PASSWORD:MySecretPassword}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 50
          batch_versioned_data: true

  # Logging - set SPRING_LOGGING_LEVEL_ROOT in .env to override the default INFO level.        
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:5MB}

  thymeleaf:
    check-template-location: false

  # Mail - set SPRING_MAIL_USERNAME/PASSWORD in .env to enable real email delivery.
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # The app is an OAuth2 resource server: Keycloak issues tokens, this only
          # verifies them. Spring uses this to discover the realm's public keys via
          # {issuer-uri}/.well-known/openid-configuration, and it must match the "iss"
          # claim inside every token exactly.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ticket-realm}
          # docker-compose additionally sets
          # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI, for when the app
          # reaches Keycloak on a different host than the one named in the token's issuer.

# Used by AuthService/KeycloakAdminClient to call Keycloak directly for login,
# registration and user administration, separately from the resourceserver config
# above (which only ever verifies tokens, never issues them or creates users).
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:ticket-realm}
  # Public client used to exchange an email/password for a token (login).
  login-client-id: ${KEYCLOAK_LOGIN_CLIENT_ID:ticket-app}
  # Confidential client whose service account holds realm-management: manage-users,
  # used to create and maintain users through Keycloak's Admin REST API.
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:ticket-backend}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:ticket-backend-secret}
  # Push the APP_ADMIN_* account into the realm at startup (non-fatal if Keycloak is down).
  bootstrap-admin: ${KEYCLOAK_BOOTSTRAP_ADMIN:true}

app:
  cors:
    # Origins allowed to call this API from a browser (the React dev server).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081}
  uploads:
    movies-dir: ${APP_UPLOADS_MOVIES_DIR:uploads/movies}
    food-items-dir: ${APP_UPLOADS_FOOD_ITEMS_DIR:uploads/food-items}
    food-items:
      max-bytes: ${APP_UPLOADS_FOOD_ITEMS_MAX_BYTES:5242880}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    force: ${APP_SEED_FORCE:true}
    halls: ${APP_SEED_HALLS:3}
    days: ${APP_SEED_DAYS:14}
    showtimesPerHallPerDay: ${APP_SEED_SHOWTIMES_PER_HALL_PER_DAY:3}
    customers: ${APP_SEED_CUSTOMERS:25}
    randomSeed: ${APP_SEED_RANDOM_SEED:20260503}
    counts:
      users: ${APP_SEED_COUNTS_USERS:24}
      cinemas: ${APP_SEED_COUNTS_CINEMAS:6}
      hallsPerCinema: ${APP_SEED_COUNTS_HALLS_PER_CINEMA:3}
      movies: ${APP_SEED_COUNTS_MOVIES:15}
      showtimesPerMovie: ${APP_SEED_COUNTS_SHOWTIMES_PER_MOVIE:5}
      foodItems: ${APP_SEED_COUNTS_FOOD_ITEMS:10}
      promoCodes: ${APP_SEED_COUNTS_PROMO_CODES:5}
      bookings: ${APP_SEED_COUNTS_BOOKINGS:20}

# The admin account this app makes sure exists (in Keycloak and in the users table)
# is APP_ADMIN_NAME / APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD, and it now lives only in
# .env - repeating those keys here would be a circular placeholder reference, since
# the key and the placeholder would have the same name. AdminSeeder carries the same
# values as its @Value defaults, for a checkout with no .env file.