server:
  port: ${SERVER_PORT:8010}
  # Finish in-flight requests on SIGTERM (docker stop) instead of cutting them off.
  shutdown: graceful
  # Behind the production reverse proxy, trust X-Forwarded-* for scheme/host
  # (set SERVER_FORWARD_HEADERS_STRATEGY=native there; none when hit directly).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  error:
    # Spring Boot DevTools turns these on for local runs; keep stack traces,
    # exception names, and raw exception messages (which can carry SQL) out of
    # error responses everywhere. ApiExceptionHandler writes its own messages.
    include-stacktrace: ${SERVER_ERROR_INCLUDE_STACKTRACE:never}
    include-exception: ${SERVER_ERROR_INCLUDE_EXCEPTION:false}
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}

spring:
  application:
    name: TicketManagementSystem

  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT:20s}

  config:
    # Every value below comes from .env in the project root. "optional:" so the app
    # still starts without it (the defaults after each ":" are the same values), and
    # real environment variables still win over the file - which is how the container
    # in docker-compose.yml overrides the localhost addresses with db:/redis:.
    import: optional:file:./.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:spring_boot_ticket}
    username: ${POSTGRES_USER:myuser}
    password: ${POSTGRES_PASSWORD:MySecretPassword}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 50
          batch_versioned_data: true

  # Logging - set SPRING_LOGGING_LEVEL_ROOT in .env to override the default INFO level.        
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:5MB}

  thymeleaf:
    check-template-location: false

  # Mail - set SPRING_MAIL_USERNAME/PASSWORD in .env to enable real email delivery.
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # RabbitMQ - booking mail is queued here (app.mail.queue). docker-compose points
  # the container at rabbitmq:5672; the management UI is on RABBITMQ_MANAGEMENT_PORT.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticket}
    password: ${RABBITMQ_PASSWORD:ticket}
    listener:
      simple:
        # A failing send is retried in the listener, then dead-lettered (booking.mail.dlq).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: ${RABBITMQ_MAIL_MAX_ATTEMPTS:4}
          initial-interval: 2s
          multiplier: 3
          max-interval: 30s

  # Redis - shared movie-browse cache and booking-lookup throttle (app.redis).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
      repositories:
        enabled: false

# Health probes for Docker and orchestrators. Only /actuator/health is exposed, without
# details. Readiness needs the database; Redis and RabbitMQ are left out on purpose:
# the app keeps working without them (memory cache, direct mail), so their outage
# must not take it out of rotation. The mail check is off: SMTP is optional.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false

# ABA PayWay KHQR checkout (sprint 9). Credentials only come from the environment;
# with no merchant id / API key the PayWay endpoints answer 503 PAYWAY_UNAVAILABLE.
payway:
  base-url: ${PAYWAY_BASE_URL:https://checkout-sandbox.payway.com.kh}
  merchant-id: ${PAYWAY_MERCHANT_ID:}
  api-key: ${PAYWAY_API_KEY:}
  # Public URL of POST /api/payway/callback; its domain must be whitelisted on the merchant profile.
  return-url: ${PAYWAY_RETURN_URL:}

app:
  # Tokens are issued and verified by this app (TokenService / JwtConfig).
  auth:
    # HMAC key for HS256, at least 32 bytes. The default is for local development only;
    # production must set APP_JWT_SECRET (openssl rand -base64 48).
    jwt-secret: ${APP_JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
    issuer: ${APP_JWT_ISSUER:ticket-management-system}
    access-token-ttl: ${APP_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${APP_REFRESH_TOKEN_TTL:7d}
    # Lifetime of an emailed forgot-password code.
    password-reset-ttl: ${APP_PASSWORD_RESET_TTL:15m}
  mail:
    queue:
      # true: booking mail goes through RabbitMQ (sent directly if the broker is down).
      # false: sent in-process after commit, no broker needed.
      enabled: ${APP_MAIL_QUEUE_ENABLED:true}
  redis:
    # true: browse cache and lookup throttle live in Redis (memory if it is down).
    # false: both stay in this instance's memory, no Redis needed.
    enabled: ${APP_REDIS_ENABLED:true}
  cors:
    # Origins allowed to call this API from a browser (the React dev server).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081}
  uploads:
    movies-dir: ${APP_UPLOADS_MOVIES_DIR:uploads/movies}
    food-items-dir: ${APP_UPLOADS_FOOD_ITEMS_DIR:uploads/food-items}
    food-items:
      max-bytes: ${APP_UPLOADS_FOOD_ITEMS_MAX_BYTES:5242880}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    force: ${APP_SEED_FORCE:true}
    halls: ${APP_SEED_HALLS:3}
    days: ${APP_SEED_DAYS:14}
    showtimesPerHallPerDay: ${APP_SEED_SHOWTIMES_PER_HALL_PER_DAY:3}
    customers: ${APP_SEED_CUSTOMERS:25}
    randomSeed: ${APP_SEED_RANDOM_SEED:20260503}
    counts:
      users: ${APP_SEED_COUNTS_USERS:24}
      cinemas: ${APP_SEED_COUNTS_CINEMAS:6}
      hallsPerCinema: ${APP_SEED_COUNTS_HALLS_PER_CINEMA:3}
      movies: ${APP_SEED_COUNTS_MOVIES:15}
      showtimesPerMovie: ${APP_SEED_COUNTS_SHOWTIMES_PER_MOVIE:5}
      foodItems: ${APP_SEED_COUNTS_FOOD_ITEMS:10}
      promoCodes: ${APP_SEED_COUNTS_PROMO_CODES:5}
      bookings: ${APP_SEED_COUNTS_BOOKINGS:20}

# The admin account this app makes sure exists in the users table
# is APP_ADMIN_NAME / APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD, and it now lives only in
# .env - repeating those keys here would be a circular placeholder reference, since
# the key and the placeholder would have the same name. AdminSeeder carries the same
# values as its @Value defaults, for a checkout with no .env file.