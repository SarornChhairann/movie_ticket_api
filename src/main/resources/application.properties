spring.application.name=TicketManagementSystem
server.port=${SERVER_PORT:8010}
spring.datasource.url=jdbc:postgresql://localhost:5433/spring_boot_ticket
spring.datasource.username=myuser
spring.datasource.password=MySecretPassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
app.uploads.movies-dir=uploads/movies
app.uploads.food-items-dir=uploads/food-items
app.uploads.food-items.max-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.thymeleaf.check-template-location=false

APP_ADMIN_EMAIL=admin@gmail.com
APP_ADMIN_PASSWORD=admin123
APP_ADMIN_NAME=System Admin

# Mail — set MAIL_HOST/USER/PASS env vars to enable real email delivery
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.security.jwt.secret=ChangeThisToASecureRandomKeyAtLeast32BytesLong123456
app.security.jwt.expiration-seconds=86400
app.seed.enabled=true
app.seed.force=true
app.seed.halls=3
app.seed.days=14
app.seed.showtimesPerHallPerDay=3
app.seed.customers=25
app.seed.randomSeed=20260503
