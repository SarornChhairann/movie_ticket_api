# =============================================================================
# Production stack.  Run it with its own env file (never the dev .env):
#
#   cp .env.prod.example .env.prod && chmod 600 .env.prod   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Shape:
#   internet ──80──▶ caddy ──edge──▶ app ──backend (internal, no internet)──▶ db, redis
#
# - No DNS name. PUBLIC_IP is the server's public address. Caddy serves the API as
#   plain HTTP on port 80. Let's Encrypt is not used.
# - Authentication is built into the app (it issues and verifies its own JWTs);
#   there is no separate identity server.
# - Only Caddy publishes a port (80). The API, Postgres and Redis are reachable
#   only inside the compose networks.
# - No RabbitMQ: on a 1 GB server the app sends booking mail directly instead.
# - "backend" is internal: the data stores cannot reach the internet at all. The app
#   also sits on "edge", which is how it reaches SMTP and PayWay.
# - Every service has a health check, a restart policy, memory/CPU limits, rotated
#   logs, and no-new-privileges; the app also runs read-only with all caps dropped.
# - Data lives in named volumes with fixed names, so renaming the project or a
#   stray `docker compose down` never orphans them (`down -v` still deletes them).
# =============================================================================

name: ticket-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *logging

services:
  # --------------------------------------------------------------------------- edge
  caddy:
    <<: *hardening
    image: caddy:2.10-alpine
    container_name: ticket-prod-caddy
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks:
      - edge
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  # --------------------------------------------------------------------------- app
  app:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_TAG:-latest}
    # Build here, or push from CI and set APP_IMAGE/APP_TAG to pull a fixed version.
    image: ${APP_IMAGE:-ticket-management-system}:${APP_TAG:-latest}
    container_name: ticket-prod-app
    init: true                  # tini as PID 1: forwards SIGTERM, reaps zombies
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /tmp/app:size=256m,mode=1777   # java.io.tmpdir (Tomcat work dir, multipart)
    cap_drop: [ALL]
    environment:
      SERVER_PORT: 8010
      SERVER_FORWARD_HEADERS_STRATEGY: native
      JAVA_OPTS: ${JAVA_OPTS:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ticket}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ticket}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: "false"
      SERVER_ERROR_INCLUDE_STACKTRACE: never
      SERVER_ERROR_INCLUDE_EXCEPTION: "false"
      SERVER_ERROR_INCLUDE_MESSAGE: never
      APP_UPLOADS_MOVIES_DIR: /app/uploads/movies
      APP_UPLOADS_FOOD_ITEMS_DIR: /app/uploads/food-items
      APP_UPLOADS_FOOD_ITEMS_MAX_BYTES: ${APP_UPLOADS_FOOD_ITEMS_MAX_BYTES:-5242880}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-5MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-5MB}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?set APP_CORS_ALLOWED_ORIGINS}
      # --- Auth: the app signs its own access tokens with this key (>= 32 bytes).
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET}
      APP_ACCESS_TOKEN_TTL: ${APP_ACCESS_TOKEN_TTL:-15m}
      APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-7d}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-System Admin}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:?set APP_ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?set APP_ADMIN_PASSWORD}
      # No demo data in production.
      APP_SEED_ENABLED: "false"
      APP_SEED_FORCE: "false"
      # --- Mail (sent directly; no RabbitMQ in this stack)
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_MAIL_QUEUE_ENABLED: "false"
      # --- Redis
      APP_REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      # --- PayWay
      PAYWAY_BASE_URL: ${PAYWAY_BASE_URL:-https://checkout.payway.com.kh}
      PAYWAY_MERCHANT_ID: ${PAYWAY_MERCHANT_ID:-}
      PAYWAY_API_KEY: ${PAYWAY_API_KEY:-}
      PAYWAY_RETURN_URL: ${PAYWAY_RETURN_URL:-}
    volumes:
      - app_uploads:/app/uploads
    networks:
      - edge
      - backend
    stop_grace_period: 30s      # > spring.lifecycle.timeout-per-shutdown-phase (20s)
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 384M }  # heap = 75% of this (MaxRAMPercentage)

  # --------------------------------------------------------------------------- data
  db:
    <<: *hardening
    image: postgres:16-alpine
    container_name: ticket-prod-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket}
      POSTGRES_USER: ${POSTGRES_USER:-ticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command: ["postgres", "-c", "max_connections=50", "-c", "shared_buffers=64MB", "-c", "log_min_duration_statement=1000"]
    shm_size: 128m
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    container_name: ticket-prod-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    # Password from the environment, not the command line (keeps it out of `ps`).
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 48mb --maxmemory-policy allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 96M }

networks:
  edge:
    name: ticket-prod-edge
    driver: bridge
  backend:
    name: ticket-prod-backend
    driver: bridge
    internal: true              # no route to the internet

volumes:
  postgres_data:
    name: ticket-prod-postgres
  redis_data:
    name: ticket-prod-redis
  app_uploads:
    name: ticket-prod-uploads
  caddy_data:
    name: ticket-prod-caddy-data
  caddy_config:
    name: ticket-prod-caddy-config
