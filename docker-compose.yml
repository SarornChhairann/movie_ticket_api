services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticket-management-system:latest
    container_name: ticket-management-system-app
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8010}:8010"
    # Everything here comes from .env. The app reads that same file directly when it
    # runs outside Docker (application.yml imports it); the few values that differ in
    # a container - the database host, and the URL Keycloak is reached on - are the
    # ones spelled out literally below.
    environment:
      SERVER_PORT: 8010
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-spring_boot_ticket}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-myuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-MySecretPassword}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-true}
      # Fixed paths: they name the app_uploads volume mounted at /app/uploads below.
      APP_UPLOADS_MOVIES_DIR: /app/uploads/movies
      APP_UPLOADS_FOOD_ITEMS_DIR: /app/uploads/food-items
      APP_UPLOADS_FOOD_ITEMS_MAX_BYTES: ${APP_UPLOADS_FOOD_ITEMS_MAX_BYTES:-5242880}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-5MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-5MB}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      # --- Keycloak -----------------------------------------------------------
      # Tokens are issued with KC_HOSTNAME in their "iss" claim (localhost, so the
      # same tokens work for Postman/Swagger on the host), while this container
      # reaches Keycloak over the compose network as http://keycloak:8080 - hence
      # the split between the issuer it validates and the two URLs it calls.
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8080/realms/ticket-realm}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ticket-realm/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ticket-realm}
      KEYCLOAK_LOGIN_CLIENT_ID: ${KEYCLOAK_LOGIN_CLIENT_ID:-ticket-app}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-ticket-backend}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-ticket-backend-secret}
      KEYCLOAK_BOOTSTRAP_ADMIN: ${KEYCLOAK_BOOTSTRAP_ADMIN:-true}
      # ------------------------------------------------------------------------
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@gmail.com}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-System Admin}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_SEED_FORCE: ${APP_SEED_FORCE:-false}
      APP_SEED_HALLS: ${APP_SEED_HALLS:-3}
      APP_SEED_DAYS: ${APP_SEED_DAYS:-14}
      APP_SEED_SHOWTIMES_PER_HALL_PER_DAY: ${APP_SEED_SHOWTIMES_PER_HALL_PER_DAY:-3}
      APP_SEED_CUSTOMERS: ${APP_SEED_CUSTOMERS:-25}
      APP_SEED_RANDOM_SEED: ${APP_SEED_RANDOM_SEED:-20260503}
      APP_SEED_COUNTS_USERS: ${APP_SEED_COUNTS_USERS:-50}
      APP_SEED_COUNTS_CINEMAS: ${APP_SEED_COUNTS_CINEMAS:-3}
      APP_SEED_COUNTS_HALLS_PER_CINEMA: ${APP_SEED_COUNTS_HALLS_PER_CINEMA:-3}
      APP_SEED_COUNTS_MOVIES: ${APP_SEED_COUNTS_MOVIES:-15}
      APP_SEED_COUNTS_SHOWTIMES_PER_MOVIE: ${APP_SEED_COUNTS_SHOWTIMES_PER_MOVIE:-5}
      APP_SEED_COUNTS_FOOD_ITEMS: ${APP_SEED_COUNTS_FOOD_ITEMS:-10}
      APP_SEED_COUNTS_PROMO_CODES: ${APP_SEED_COUNTS_PROMO_CODES:-5}
      APP_SEED_COUNTS_BOOKINGS: ${APP_SEED_COUNTS_BOOKINGS:-20}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      # --- RabbitMQ: booking mail queue -----------------------------------------
      APP_MAIL_QUEUE_ENABLED: ${APP_MAIL_QUEUE_ENABLED:-true}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-ticket}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ticket}
      RABBITMQ_MAIL_MAX_ATTEMPTS: ${RABBITMQ_MAIL_MAX_ATTEMPTS:-4}
      # --- Redis: browse cache + booking-lookup throttle -------------------------
      APP_REDIS_ENABLED: ${APP_REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # --- PayWay ----------------------------------------------------------------
      PAYWAY_BASE_URL: ${PAYWAY_BASE_URL:-https://checkout-sandbox.payway.com.kh}
      PAYWAY_MERCHANT_ID: ${PAYWAY_MERCHANT_ID:-}
      PAYWAY_API_KEY: ${PAYWAY_API_KEY:-}
      PAYWAY_RETURN_URL: ${PAYWAY_RETURN_URL:-}
    volumes:
      - app_uploads:/app/uploads
    networks:
      - ticket-net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: ticket-management-system-keycloak
    # --import-realm loads keycloak/realm-export.json on a fresh container: the
    # ticket-realm, its customer/admin roles, both clients, and the demo accounts.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fixes the hostname Keycloak puts in tokens and URLs, so "iss" is the same
      # whether the request came from another container or from the host.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # The whole data dir, not just data/h2: an empty named volume takes its
      # ownership from the directory it shadows, and only /opt/keycloak/data
      # exists in the image already owned by the (non-root) keycloak user.
      - keycloak_data:/opt/keycloak/data
    networks:
      - ticket-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ticket-management-system-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spring_boot_ticket}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MySecretPassword}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ticket-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: ticket-management-system-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ticket}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ticket}
    ports:
      # AMQP for an app run on the host; management UI at http://localhost:15672.
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      # Queued mail (durable queues, persistent messages) survives a restart.
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ticket-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: ticket-management-system-redis
    # Only a cache and a throttle live here, so it is capped and evicts least-recently
    # used keys; append-only keeps the lookup throttle across a restart.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ticket-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  ticket-net:
    name: ticket-management-net
    driver: bridge

volumes:
  app_uploads:
  postgres_data:
  keycloak_data:
  rabbitmq_data:
  redis_data:
